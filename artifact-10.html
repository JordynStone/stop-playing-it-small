<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bold Traveler Compass — The Debrief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F8F6F0; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #3A3A3A;
    line-height: 1.6;
    min-height: 100vh;
  }
  button:not(:disabled):hover { transform: translateY(-2px); }
  button:not(:disabled):active { transform: translateY(0); }
  textarea:focus, input:focus { border-color: #D4A574 !important; outline: none;
    box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TEAL = '#2C5F5D';
const GOLD = '#D4A574';
const CREAM = '#F8F6F0';
const CORAL = '#E8A87C';
const CHARCOAL = '#3A3A3A';

const NEXT_LESSON_URL = 'https://www.skool.com/solo-and-fearless-3331/classroom/e6454d3e?md=09f63a0cb6454e25bfed8c13df9e90cc';

const IconCompass = ({ size = 28, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  </svg>
);

const IconDownload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
);

const IconUpload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
);

const IconArrowRight = ({ size = 18, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  </svg>
);

const IconArrowLeft = ({ size = 18, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <polyline points="12 19 5 12 12 5"/>
  </svg>
);

const IconSparkle = ({ size = 18, color = GOLD }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
  </svg>
);

const IconRefresh = ({ size = 20, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </svg>
);

const IconCheckCircle = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  </svg>
);

const IconClock = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  </svg>
);

const IconBookmark = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
  </svg>
);

const commitmentOptions = [
  { id: 'yes', label: 'Yes, I commit to the 48-hour debrief' },
  { id: 'try', label: 'I will try' },
  { id: 'no', label: 'No, I cannot commit to that timing' },
];

const debriefQuestions = [
  {
    number: 1,
    label: 'On the stretch',
    question: 'Which of the Stretch Trip Formula factors did this trip actually deliver on? Which ones felt easier than expected and which ones were harder than you anticipated?',
    hint: 'Be specific. Not "language was fine." What exactly happened and how did you handle it?',
  },
  {
    number: 2,
    label: 'On the proof',
    question: 'What did you do on this trip that you would not have believed you could do before you went?',
    hint: 'Write it down in full sentences. Not a list. A proper account. This is the evidence file you will reach for when the next fear shows up.',
  },
  {
    number: 3,
    label: 'On the pattern',
    question: 'Was there a moment where you almost played it small? Where you almost chose the tourist option, the familiar restaurant, the earlier train home?',
    hint: 'What made you push through it or not? What would you do differently?',
  },
  {
    number: 4,
    label: 'On the next level',
    question: 'Based on this trip, which Stretch Trip Formula factors are you ready to push further on next time?',
    hint: 'What does the next destination look like if you apply two to three of those factors honestly? Write a specific answer, not a vague one.',
  },
];

const PAGES = ['import', 'continuity', 'preview', 'commitment', 'save', 'exported'];

function BoldTravelerCompassM5L2() {
  const [pageIndex, setPageIndex] = useState(0);
  const [importedData, setImportedData] = useState(null);
  const [importError, setImportError] = useState(null);
  const [commitment, setCommitment] = useState(null);
  const [hasExported, setHasExported] = useState(false);
  const [showRestartConfirm, setShowRestartConfirm] = useState(false);
  const fileInputRef = useRef(null);

  const page = PAGES[pageIndex];

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [pageIndex]);

  const goNext = () => setPageIndex(i => Math.min(i + 1, PAGES.length - 1));
  const goBack = () => setPageIndex(i => Math.max(i - 1, 0));

  const handleRestart = () => setShowRestartConfirm(true);
  const cancelRestart = () => setShowRestartConfirm(false);
  const confirmRestart = () => {
    setPageIndex(0);
    setImportedData(null);
    setImportError(null);
    setCommitment(null);
    setHasExported(false);
    setShowRestartConfirm(false);
  };

  const handleFileImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.name.endsWith('.json')) {
      setImportError('That does not look like a Compass progress file. It should end in .json');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.sections || !data.sections.tripDuration) {
          setImportError('This file is missing your Module 4 Lesson 3 answer. Make sure you are importing the BoldTraveler_Progress9.json file.');
          return;
        }
        setImportedData(data);
        setImportError(null);
        goNext();
      } catch (err) {
        setImportError('Could not read this file. It may be corrupted. Try downloading it again from Module 4 Lesson 3.');
      }
    };
    reader.readAsText(file);
  };

  const destination = importedData?.sections?.nextDestination?.destination || '';
  const stretchFactors = importedData?.sections?.nextDestination?.stretchFactors || [];
  const primaryFear = importedData?.sections?.lastTripLessons?.primarySpecificFear || '';

  const canAdvanceFromCommitment = commitment !== null;

  const wrapStyle = {
    fontFamily: "'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif",
    background: 'radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%), radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%), radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%), ' + CREAM,
    backgroundAttachment: 'fixed', color: CHARCOAL,
    minHeight: '100vh', padding: '80px 32px 120px', lineHeight: 1.6,
  };

  const inner = { maxWidth: '720px', margin: '0 auto' };

  const card = {
    background: '#fff', borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '36px 32px 60px',
    boxShadow: '0 10px 30px rgba(44,95,93,0.09)',
    marginBottom: '20px',
  };

  const headerBar = {
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    gap: '10px', marginBottom: '24px', paddingBottom: '14px',
    borderBottom: `1px solid ${GOLD}40`,
  };

  const headerLeft = { display: 'flex', alignItems: 'center', gap: '10px' };

  const headerTitle = {
    fontSize: '13px', fontWeight: 600, color: TEAL,
    letterSpacing: '1.2px', textTransform: 'uppercase',
  };

  const refreshBtn = {
    background: '#FFFFFF', border: '1px solid rgba(212,165,116,0.55)', color: TEAL,
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)', transition: 'transform .2s, box-shadow .2s',
    cursor: 'pointer', padding: '8px', borderRadius: '999px',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
  };

  const h1 = { fontSize: '26px', fontWeight: 700, color: TEAL, marginBottom: '8px', lineHeight: 1.25 };
  const h2 = { fontSize: '20px', fontWeight: 600, color: TEAL, marginBottom: '14px', lineHeight: 1.3 };
  const h3 = { fontSize: '16px', fontWeight: 600, color: TEAL, marginBottom: '10px', lineHeight: 1.3 };
  const label = { fontSize: '12px', fontWeight: 600, color: GOLD, letterSpacing: '1.5px', textTransform: 'uppercase', marginBottom: '12px', display: 'block' };
  const p = { fontSize: '15.5px', color: CHARCOAL, marginBottom: '14px', lineHeight: 1.65 };
  const blockquote = { borderLeft: `3px solid ${GOLD}`, paddingLeft: '16px', fontSize: '15.5px', fontStyle: 'italic', color: CHARCOAL, margin: '16px 0', lineHeight: 1.6 };

  const optionButton = (selected) => ({
    width: '100%', textAlign: 'left', padding: '16px 18px', marginBottom: '10px',
    border: `2px solid ${selected ? TEAL : '#E5E0D5'}`,
    background: selected ? `${TEAL}0D` : '#fff',
    borderRadius: '14px', cursor: 'pointer', fontFamily: 'inherit', fontSize: '14.5px',
    color: CHARCOAL, fontWeight: selected ? 600 : 400, transition: 'all 0.15s ease, transform .2s, box-shadow .2s',
    display: 'flex', alignItems: 'center', gap: '12px',
    boxShadow: selected ? '0 8px 22px rgba(44,95,93,0.22)' : '0 10px 30px rgba(44,95,93,0.09)',
});

  const radioCircle = (selected) => ({
    width: '20px', height: '20px', borderRadius: '50%',
    border: `2px solid ${selected ? TEAL : '#C4BDB0'}`,
    background: selected ? TEAL : 'transparent', flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  });

  const radioDot = { width: '8px', height: '8px', borderRadius: '50%', background: '#fff' };

  const primaryButton = (disabled) => ({
    background: disabled ? '#C4BDB0' : 'linear-gradient(to bottom, #37716E, #2C5F5D)', color: '#fff', border: 'none',
    padding: '14px 24px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
    boxShadow: disabled ? 'none' : '0 8px 22px rgba(44,95,93,0.32)',
});

  const backButton = {
    background: '#FFFFFF', color: TEAL,
    border: '1px solid rgba(212,165,116,0.55)',
    padding: '14px 24px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)',
};

  const successButton = {
    background: 'linear-gradient(to bottom, #E0B98A, #D4A574)', color: '#142E2C', border: 'none', padding: '14px 24px',
    borderRadius: '999px', fontFamily: 'inherit', fontSize: '15px', fontWeight: 700,
    boxShadow: '0 8px 22px rgba(212,165,116,0.45)',
    cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px', textDecoration: 'none',
  };

  const hr = { border: 'none', borderTop: `1px solid ${GOLD}40`, margin: '24px 0' };

  const navRow = {
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    gap: '12px', marginTop: '8px', marginBottom: '32px', flexWrap: 'wrap',
  };

  const successCard = {
    background: `${GOLD}15`, border: `2px solid ${GOLD}`,
    borderRadius: '12px', padding: '28px 24px', marginBottom: '20px', textAlign: 'center',
  };

  const errorBox = {
    background: `${CORAL}20`, border: `1px solid ${CORAL}`,
    borderRadius: '8px', padding: '12px 16px',
    fontSize: '14px', color: CHARCOAL, marginBottom: '16px',
  };

  const tripContextCard = {
    background: `${GOLD}10`,
    border: `1px solid ${GOLD}`,
    borderRadius: '10px',
    padding: '20px 22px',
    marginTop: '16px',
    marginBottom: '20px',
  };

  const debriefQuestionCard = {
    background: '#FDFCF7',
    border: '1px solid #E5E0D5',
    borderRadius: '10px',
    padding: '20px 22px',
    marginBottom: '14px',
    position: 'relative',
  };

  const questionNumber = {
    position: 'absolute',
    top: '20px',
    right: '22px',
    width: '32px',
    height: '32px',
    borderRadius: '50%',
    background: `${TEAL}15`,
    color: TEAL,
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'center',
    fontSize: '14px',
    fontWeight: 700,
  };

  const previewNote = {
    background: `${TEAL}08`,
    border: `1px dashed ${TEAL}40`,
    borderRadius: '8px',
    padding: '14px 16px',
    fontSize: '13.5px',
    color: '#6B6B6B',
    marginTop: '16px',
    lineHeight: 1.55,
    fontStyle: 'italic',
    display: 'flex',
    alignItems: 'flex-start',
    gap: '10px',
  };

  const commitmentBox = {
    background: `${GOLD}08`,
    border: `1px solid ${GOLD}40`,
    borderRadius: '10px',
    padding: '18px 20px',
    marginTop: '16px',
    marginBottom: '20px',
  };

  const modalOverlay = {
    position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
    background: 'rgba(58, 58, 58, 0.55)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    zIndex: 1000, padding: '24px',
  };

  const modalCard = {
    background: '#fff', borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '32px 28px', maxWidth: '440px', width: '100%',
    boxShadow: '0 20px 46px rgba(20, 46, 44, 0.4)',
  };

  const Header = () => (
    <div style={headerBar}>
      <div style={headerLeft}>
        <IconCompass size={22} />
        <div style={headerTitle}>Bold Traveler Compass</div>
      </div>
      <button style={refreshBtn} onClick={handleRestart} title="Start over" aria-label="Start over">
        <IconRefresh size={20} color={TEAL} />
      </button>
    </div>
  );

  const RestartModal = () => (
    <div style={modalOverlay} onClick={cancelRestart}>
      <div style={modalCard} onClick={(e) => e.stopPropagation()}>
        <h2 style={{...h2, marginBottom: '12px'}}>Start over?</h2>
        <p style={p}>
          This will clear everything you have filled in on this page and bring you back to the beginning. Anything you have not downloaded yet will be lost.
        </p>
        <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '24px'}}>
          If you have already downloaded a progress file, you can import it again next time to pick up where you left off.
        </p>
        <div style={{display: 'flex', gap: '12px', justifyContent: 'flex-end', flexWrap: 'wrap'}}>
          <button style={backButton} onClick={cancelRestart}>Keep my answers</button>
          <button style={{...primaryButton(false), background: CORAL}} onClick={confirmRestart}>
            Yes, start over
          </button>
        </div>
      </div>
    </div>
  );

  const handleExport = () => {
    const commitmentLabel = commitmentOptions.find(o => o.id === commitment)?.label || '';

    const updatedData = {
      ...importedData,
      version: (importedData?.version || 1) + 1,
      lastCompleted: 'Module 5 Lesson 2 — The Debrief',
      timestamp: new Date().toISOString(),
      sections: {
        ...importedData.sections,
        debriefTemplate: {
          status: 'prepared',
          fortyEightHourCommitment: commitmentLabel,
          tripContext: {
            destination: destination,
            stretchFactorsCommittedTo: stretchFactors,
            primaryFear: primaryFear,
          },
          questions: debriefQuestions.map(q => ({
            number: q.number,
            label: q.label,
            question: q.question,
            hint: q.hint,
            answer: '',
          })),
          completedAt: null,
        },
      },
    };

    const blob = new Blob([JSON.stringify(updatedData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'BoldTraveler_Progress10.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setHasExported(true);
    goNext();
  };

  const renderPage = () => {
    if (page === 'import') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Welcome back</div>
          <h1 style={h1}>Bring your Compass with you.</h1>
          <p style={p}>
            In Lesson 3 you set the shape of your trip. Module 5 is the lesson that turns one trip into evidence for the next one. This is where the debrief lives.
          </p>
          <p style={{...p, fontSize: '14px', color: '#6B6B6B'}}>
            Look for <strong style={{color: TEAL}}>BoldTraveler_Progress9.json</strong> on your device.
          </p>

          {importError && <div style={errorBox}>{importError}</div>}

          <div style={{marginTop: '20px', marginBottom: '12px'}}>
            <input
              ref={fileInputRef}
              type="file"
              accept=".json,application/json"
              onChange={handleFileImport}
              style={{display: 'none'}}
            />
            <button style={primaryButton(false)} onClick={() => fileInputRef.current?.click()}>
              <IconUpload />
              Choose my progress file
            </button>
          </div>

          <hr style={hr} />

          <div style={{...p, fontSize: '13.5px', color: '#6B6B6B', marginBottom: 0}}>
            <strong style={{color: TEAL}}>Cannot find the file?</strong> No problem. Go back to Module 4 Lesson 3, complete it, and download the file from there. Then come back here.
          </div>
          <div style={{minHeight: '24px'}}></div>
        </div>
      );
    }

    if (page === 'continuity') {
      return (
        <div style={card}>
          <Header />
          <div style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px'}}>
            <IconCheckCircle size={22} color={TEAL} />
            <div style={{...label, marginBottom: 0, color: TEAL}}>Progress restored</div>
          </div>
          <h1 style={h1}>This one is different.</h1>
          <p style={p}>
            Every other Compass moment so far has captured an answer. This one does not. The debrief happens after your trip, not now. What you are doing right now is preparing the template so it is ready and waiting when you come home.
          </p>

          <div style={previewNote}>
            <IconBookmark size={18} color={TEAL} />
            <div>
              <strong style={{color: TEAL}}>Why this matters.</strong> Without a structured debrief, a bold trip stays as a memory. With it, the trip becomes evidence you can transfer to the next destination. The four questions you are about to preview turn one trip into fuel for everything that follows.
            </div>
          </div>

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(false)} onClick={goNext}>
              Show me the template
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'preview') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 5 · Lesson 2</div>
          <h1 style={h1}>Your debrief template.</h1>
          <p style={{...p, marginTop: '8px'}}>
            Four questions, pre-anchored to the trip you are about to take. Read through them now so you know what is waiting. Come home, sit with these for thirty minutes, and the trip becomes evidence.
          </p>

          {destination && (
            <div style={tripContextCard}>
              <div style={{...label, color: TEAL, marginBottom: '10px'}}>The trip these questions are about</div>
              <div style={{fontSize: '17px', color: CHARCOAL, fontWeight: 700, lineHeight: 1.3, marginBottom: stretchFactors.length > 0 || primaryFear ? '12px' : 0}}>
                {destination}
              </div>
              {stretchFactors.length > 0 && (
                <div style={{fontSize: '14px', color: CHARCOAL, lineHeight: 1.5, marginBottom: primaryFear ? '8px' : 0}}>
                  <strong>Stretching on:</strong> {stretchFactors.join(', ')}
                </div>
              )}
              {primaryFear && (
                <div style={{fontSize: '14px', color: CHARCOAL, lineHeight: 1.5}}>
                  <strong>Addressing the fear of:</strong> {primaryFear}
                </div>
              )}
            </div>
          )}

          <hr style={hr} />

          <h2 style={h2}>The four questions waiting for you.</h2>

          <div style={{marginTop: '20px'}}>
            {debriefQuestions.map(q => (
              <div key={q.number} style={debriefQuestionCard}>
                <div style={questionNumber}>{q.number}</div>
                <div style={{...label, color: GOLD, marginBottom: '6px', paddingRight: '40px'}}>{q.label}</div>
                <h3 style={{...h3, paddingRight: '40px', marginBottom: '8px'}}>
                  {q.question}
                </h3>
                <p style={{fontSize: '13.5px', color: '#6B6B6B', lineHeight: 1.55, marginBottom: 0}}>
                  {q.hint}
                </p>
              </div>
            ))}
          </div>

          <div style={previewNote}>
            <IconBookmark size={18} color={TEAL} />
            <div>
              <strong style={{color: TEAL}}>You are not filling these in today.</strong> You are confirming they exist and that you know what is waiting. You will return to your Compass within 48 hours of coming home and fill them in then. That timing matters.
            </div>
          </div>

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(false)} onClick={goNext}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'commitment') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 5 · Lesson 2</div>
          <h1 style={h1}>The 48-hour window.</h1>
          <p style={{...p, marginTop: '8px'}}>
            Within seven days of landing, the details are still honest. Within 48 hours, they are sharp. The most useful debriefs happen before real life has had time to polish the experience into a tidy memory.
          </p>

          <div style={commitmentBox}>
            <div style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '10px'}}>
              <IconClock size={20} color={GOLD} />
              <div style={{...label, color: TEAL, marginBottom: 0}}>The commitment</div>
            </div>
            <p style={{...p, fontSize: '14.5px', marginBottom: 0, lineHeight: 1.6}}>
              Set aside 30 minutes within 48 hours of coming home from {destination || 'your trip'}. A notebook or a notes app. Somewhere quiet. Open your Compass and work through the four questions in order.
            </p>
          </div>

          <hr style={hr} />

          <h2 style={h2}>Can you commit to that?</h2>
          <p style={{...p, fontSize: '14.5px', color: '#6B6B6B'}}>
            Be honest. A no answered now is more useful than a yes you do not keep.
          </p>

          <div style={{marginTop: '16px', marginBottom: '24px'}}>
            {commitmentOptions.map(opt => (
              <button
                key={opt.id}
                style={optionButton(commitment === opt.id)}
                onClick={() => setCommitment(opt.id)}
              >
                <div style={radioCircle(commitment === opt.id)}>
                  {commitment === opt.id && <div style={radioDot}></div>}
                </div>
                {opt.label}
              </button>
            ))}
          </div>

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(!canAdvanceFromCommitment)} onClick={goNext} disabled={!canAdvanceFromCommitment}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {!canAdvanceFromCommitment && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Answer honestly to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'save') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Save your progress</div>
          <h1 style={h1}>The template is ready.</h1>
          <p style={p}>
            The four debrief questions are now waiting in your Compass, pre-anchored to <strong style={{color: TEAL}}>{destination}</strong>. When you come home, open the file, find the debrief section, and fill in your answers.
          </p>
          <blockquote style={blockquote}>
            Every debrief you complete makes the next Stretch Trip Formula decision faster and more honest. This is how bold travel compounds over time.
          </blockquote>

          <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '20px'}}>
            The file will be saved as <strong style={{color: TEAL}}>BoldTraveler_Progress10.json</strong>. This is the file you will import in Lesson 3 for the final Compass moment before your PDF.
          </p>

          <button style={primaryButton(false)} onClick={handleExport}>
            <IconDownload />
            Download my progress
          </button>

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'exported') {
      return (
        <React.Fragment>
          <div style={successCard}>
            <div style={{display: 'flex', justifyContent: 'center', marginBottom: '12px'}}>
              <IconSparkle size={32} color={GOLD} />
            </div>
            <h2 style={{...h2, color: TEAL, marginBottom: '10px'}}>Ten sections down. One to go.</h2>
            <p style={{...p, marginBottom: '6px'}}>
              <strong>BoldTraveler_Progress10.json</strong> has been saved to your device.
            </p>
            <p style={{...p, fontSize: '14.5px', marginBottom: 0}}>
              Your Compass now holds a debrief template ready to fill in after your trip. The next lesson is the last Compass moment before your Bold Traveler Compass becomes a PDF you keep.
            </p>
          </div>

          <div style={card}>
            <Header />
            <h2 style={h2}>Continue to Lesson 3</h2>
            <p style={p}>
              The next Compass moment is <em>The Re-Entry Plan</em>. It is the final structured capture, then your Compass becomes a designed PDF you keep.
            </p>
            <a href={NEXT_LESSON_URL} target="_blank" rel="noopener noreferrer" style={successButton}>
              Take me to Lesson 3
              <IconArrowRight />
            </a>
            <hr style={hr} />
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Go back and review my answers
            </button>
            <div style={{minHeight: '32px'}}></div>
          </div>
        </React.Fragment>
      );
    }

    return null;
  };

  return (
    <React.Fragment>
      {showRestartConfirm && <RestartModal />}
      <div style={wrapStyle}>
        <div style={inner}>
          {renderPage()}
        </div>
      </div>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BoldTravelerCompassM5L2 />);
</script>
</body>
</html>
