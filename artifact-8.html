<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bold Traveler Compass — Beyond the Tourist Bubble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F8F6F0; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #3A3A3A;
    line-height: 1.6;
    min-height: 100vh;
  }
  button:not(:disabled):hover { transform: translateY(-2px); }
  button:not(:disabled):active { transform: translateY(0); }
  textarea:focus, input:focus { border-color: #D4A574 !important; outline: none;
    box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TEAL = '#2C5F5D';
const GOLD = '#D4A574';
const CREAM = '#F8F6F0';
const CORAL = '#E8A87C';
const CHARCOAL = '#3A3A3A';

const NEXT_LESSON_URL = 'https://www.skool.com/solo-and-fearless-3331/classroom/e6454d3e?md=2613e39ae84e492db10820555a8b0a32';

const IconCompass = ({ size = 28, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  </svg>
);

const IconDownload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
);

const IconUpload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
);

const IconArrowRight = ({ size = 18, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  </svg>
);

const IconArrowLeft = ({ size = 18, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <polyline points="12 19 5 12 12 5"/>
  </svg>
);

const IconSparkle = ({ size = 18, color = GOLD }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
  </svg>
);

const IconRefresh = ({ size = 20, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </svg>
);

const IconCheckCircle = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  </svg>
);

const IconCheck = ({ size = 14, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
);

const IconUtensils = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
    <line x1="7" y1="2" x2="7" y2="22"/>
    <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
  </svg>
);

const IconBus = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M8 6v6"/>
    <path d="M15 6v6"/>
    <path d="M2 12h19.6"/>
    <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/>
    <circle cx="7" cy="18" r="2"/>
    <path d="M9 18h5"/>
    <circle cx="16" cy="18" r="2"/>
  </svg>
);

const IconWalk = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="13" cy="4" r="2"/>
    <path d="M15 22l-1-6-3-2"/>
    <path d="M9 12l3-3 3 3v6"/>
    <path d="M9 20l3-4"/>
    <path d="M11 9l-3 2-1 4"/>
  </svg>
);

const commitments = [
  {
    id: 'food',
    icon: IconUtensils,
    label: 'Eat outside the tourist menu',
    desc: 'Find a place that does not have a translated menu outside or appear on the first page of travel recommendations.',
  },
  {
    id: 'transport',
    icon: IconBus,
    label: 'Use the transport locals use',
    desc: 'Not the tourist shuttle. The bus, the metro, the tram that people who live there take every day.',
  },
  {
    id: 'unplanned',
    icon: IconWalk,
    label: 'One full day with no planned agenda',
    desc: 'A neighbourhood you have not been to, a direction you have not walked, and the willingness to see what is there.',
  },
];

const PAGES = ['import', 'continuity', 'commitments', 'save', 'exported'];

function BoldTravelerCompassM4L2() {
  const [pageIndex, setPageIndex] = useState(0);
  const [importedData, setImportedData] = useState(null);
  const [importError, setImportError] = useState(null);
  const [selectedCommitments, setSelectedCommitments] = useState([]);
  const [hasExported, setHasExported] = useState(false);
  const [showRestartConfirm, setShowRestartConfirm] = useState(false);
  const fileInputRef = useRef(null);

  const page = PAGES[pageIndex];

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [pageIndex]);

  const goNext = () => setPageIndex(i => Math.min(i + 1, PAGES.length - 1));
  const goBack = () => setPageIndex(i => Math.max(i - 1, 0));

  const handleRestart = () => setShowRestartConfirm(true);
  const cancelRestart = () => setShowRestartConfirm(false);
  const confirmRestart = () => {
    setPageIndex(0);
    setImportedData(null);
    setImportError(null);
    setSelectedCommitments([]);
    setHasExported(false);
    setShowRestartConfirm(false);
  };

  const toggleCommitment = (id) => {
    setSelectedCommitments(prev =>
      prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
    );
  };

  const handleFileImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.name.endsWith('.json')) {
      setImportError('That does not look like a Compass progress file. It should end in .json');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.sections || !data.sections.oneTradeoff) {
          setImportError('This file is missing your Module 3 Lesson 3 answer. Make sure you are importing the BoldTraveler_Progress7.json file.');
          return;
        }
        setImportedData(data);
        setImportError(null);
        goNext();
      } catch (err) {
        setImportError('Could not read this file. It may be corrupted. Try downloading it again from Module 3 Lesson 3.');
      }
    };
    reader.readAsText(file);
  };

  const destination = importedData?.sections?.nextDestination?.destination || '';

  const canAdvanceFromCommitments = selectedCommitments.length > 0;

  const wrapStyle = {
    fontFamily: "'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif",
    background: 'radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%), radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%), radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%), ' + CREAM,
    backgroundAttachment: 'fixed', color: CHARCOAL,
    minHeight: '100vh', padding: '80px 32px 120px', lineHeight: 1.6,
  };

  const inner = { maxWidth: '720px', margin: '0 auto' };

  const card = {
    background: '#fff', borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '36px 32px 60px',
    boxShadow: '0 10px 30px rgba(44,95,93,0.09)',
    marginBottom: '20px',
  };

  const headerBar = {
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    gap: '10px', marginBottom: '24px', paddingBottom: '14px',
    borderBottom: `1px solid ${GOLD}40`,
  };

  const headerLeft = { display: 'flex', alignItems: 'center', gap: '10px' };

  const headerTitle = {
    fontSize: '13px', fontWeight: 600, color: TEAL,
    letterSpacing: '1.2px', textTransform: 'uppercase',
  };

  const refreshBtn = {
    background: '#FFFFFF', border: '1px solid rgba(212,165,116,0.55)', color: TEAL,
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)', transition: 'transform .2s, box-shadow .2s',
    cursor: 'pointer', padding: '8px', borderRadius: '999px',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
  };

  const h1 = { fontSize: '26px', fontWeight: 700, color: TEAL, marginBottom: '8px', lineHeight: 1.25 };
  const h2 = { fontSize: '20px', fontWeight: 600, color: TEAL, marginBottom: '14px', lineHeight: 1.3 };
  const label = { fontSize: '12px', fontWeight: 600, color: GOLD, letterSpacing: '1.5px', textTransform: 'uppercase', marginBottom: '12px', display: 'block' };
  const p = { fontSize: '15.5px', color: CHARCOAL, marginBottom: '14px', lineHeight: 1.65 };
  const blockquote = { borderLeft: `3px solid ${GOLD}`, paddingLeft: '16px', fontSize: '15.5px', fontStyle: 'italic', color: CHARCOAL, margin: '16px 0', lineHeight: 1.6 };

  const commitmentCard = (selected) => ({
    width: '100%', textAlign: 'left', padding: '20px',
    marginBottom: '12px',
    border: `2px solid ${selected ? TEAL : '#E5E0D5'}`,
    background: selected ? `${TEAL}0D` : '#fff',
    borderRadius: '14px', cursor: 'pointer', fontFamily: 'inherit',
    color: CHARCOAL, transition: 'all 0.15s ease, transform .2s, box-shadow .2s',
    display: 'flex', alignItems: 'flex-start', gap: '16px',
    boxShadow: selected ? '0 8px 22px rgba(44,95,93,0.22)' : '0 10px 30px rgba(44,95,93,0.09)',
});

  const iconCircle = (selected) => ({
    width: '44px',
    height: '44px',
    borderRadius: '10px',
    background: selected ? TEAL : `${TEAL}15`,
    flexShrink: 0,
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'center',
    transition: 'all 0.15s ease',
  });

  const checkBox = (selected) => ({
    width: '22px', height: '22px', borderRadius: '6px',
    border: `2px solid ${selected ? TEAL : '#C4BDB0'}`,
    background: selected ? TEAL : 'transparent', flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    marginTop: '2px',
  });

  const primaryButton = (disabled) => ({
    background: disabled ? '#C4BDB0' : 'linear-gradient(to bottom, #37716E, #2C5F5D)', color: '#fff', border: 'none',
    padding: '14px 24px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
    boxShadow: disabled ? 'none' : '0 8px 22px rgba(44,95,93,0.32)',
});

  const backButton = {
    background: '#FFFFFF', color: TEAL,
    border: '1px solid rgba(212,165,116,0.55)',
    padding: '14px 24px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)',
};

  const successButton = {
    background: 'linear-gradient(to bottom, #E0B98A, #D4A574)', color: '#142E2C', border: 'none', padding: '14px 24px',
    borderRadius: '999px', fontFamily: 'inherit', fontSize: '15px', fontWeight: 700,
    boxShadow: '0 8px 22px rgba(212,165,116,0.45)',
    cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px', textDecoration: 'none',
  };

  const hr = { border: 'none', borderTop: `1px solid ${GOLD}40`, margin: '24px 0' };

  const navRow = {
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    gap: '12px', marginTop: '8px', marginBottom: '32px', flexWrap: 'wrap',
  };

  const successCard = {
    background: `${GOLD}15`, border: `2px solid ${GOLD}`,
    borderRadius: '12px', padding: '28px 24px', marginBottom: '20px', textAlign: 'center',
  };

  const destinationHighlight = {
    background: `${GOLD}15`, border: `1px solid ${GOLD}`,
    borderRadius: '10px', padding: '20px 22px',
    marginTop: '20px', marginBottom: '12px',
  };

  const errorBox = {
    background: `${CORAL}20`, border: `1px solid ${CORAL}`,
    borderRadius: '8px', padding: '12px 16px',
    fontSize: '14px', color: CHARCOAL, marginBottom: '16px',
  };

  const modalOverlay = {
    position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
    background: 'rgba(58, 58, 58, 0.55)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    zIndex: 1000, padding: '24px',
  };

  const modalCard = {
    background: '#fff', borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '32px 28px', maxWidth: '440px', width: '100%',
    boxShadow: '0 20px 46px rgba(20, 46, 44, 0.4)',
  };

  const Header = () => (
    <div style={headerBar}>
      <div style={headerLeft}>
        <IconCompass size={22} />
        <div style={headerTitle}>Bold Traveler Compass</div>
      </div>
      <button style={refreshBtn} onClick={handleRestart} title="Start over" aria-label="Start over">
        <IconRefresh size={20} color={TEAL} />
      </button>
    </div>
  );

  const RestartModal = () => (
    <div style={modalOverlay} onClick={cancelRestart}>
      <div style={modalCard} onClick={(e) => e.stopPropagation()}>
        <h2 style={{...h2, marginBottom: '12px'}}>Start over?</h2>
        <p style={p}>
          This will clear everything you have filled in on this page and bring you back to the beginning. Anything you have not downloaded yet will be lost.
        </p>
        <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '24px'}}>
          If you have already downloaded a progress file, you can import it again next time to pick up where you left off.
        </p>
        <div style={{display: 'flex', gap: '12px', justifyContent: 'flex-end', flexWrap: 'wrap'}}>
          <button style={backButton} onClick={cancelRestart}>Keep my answers</button>
          <button style={{...primaryButton(false), background: CORAL}} onClick={confirmRestart}>
            Yes, start over
          </button>
        </div>
      </div>
    </div>
  );

  const handleExport = () => {
    const selectedLabels = selectedCommitments.map(id =>
      commitments.find(c => c.id === id)?.label
    ).filter(Boolean);

    const updatedData = {
      ...importedData,
      version: (importedData?.version || 1) + 1,
      lastCompleted: 'Module 4 Lesson 2 — Beyond the Tourist Bubble',
      timestamp: new Date().toISOString(),
      sections: {
        ...importedData.sections,
        tourBubbleCommitments: {
          commitments: selectedLabels,
          commitmentCount: selectedCommitments.length,
        },
      },
    };

    const blob = new Blob([JSON.stringify(updatedData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'BoldTraveler_Progress8.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setHasExported(true);
    goNext();
  };

  const renderPage = () => {
    if (page === 'import') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Welcome back</div>
          <h1 style={h1}>Bring your Compass with you.</h1>
          <p style={p}>
            You completed Module 3 and read The Language Principle in Module 4 Lesson 1. Now you commit to what stepping outside the tourist bubble actually looks like on your trip.
          </p>
          <p style={{...p, fontSize: '14px', color: '#6B6B6B'}}>
            Look for <strong style={{color: TEAL}}>BoldTraveler_Progress7.json</strong> on your device.
          </p>

          {importError && <div style={errorBox}>{importError}</div>}

          <div style={{marginTop: '20px', marginBottom: '12px'}}>
            <input
              ref={fileInputRef}
              type="file"
              accept=".json,application/json"
              onChange={handleFileImport}
              style={{display: 'none'}}
            />
            <button style={primaryButton(false)} onClick={() => fileInputRef.current?.click()}>
              <IconUpload />
              Choose my progress file
            </button>
          </div>

          <hr style={hr} />

          <div style={{...p, fontSize: '13.5px', color: '#6B6B6B', marginBottom: 0}}>
            <strong style={{color: TEAL}}>Cannot find the file?</strong> No problem. Go back to Module 3 Lesson 3, complete it, and download the file from there. Then come back here.
          </div>
          <div style={{minHeight: '24px'}}></div>
        </div>
      );
    }

    if (page === 'continuity') {
      return (
        <div style={card}>
          <Header />
          <div style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px'}}>
            <IconCheckCircle size={22} color={TEAL} />
            <div style={{...label, marginBottom: 0, color: TEAL}}>Progress restored</div>
          </div>
          <h1 style={h1}>Step out of the bubble.</h1>
          <p style={p}>
            The tourist bubble is not a place, it is a mode. You can be in {destination || 'your destination'} and never leave it. Same cafes, same neighbourhoods, same routes every other visitor takes. Comfortable. Predictable. And not where the growth happens.
          </p>

          {destination && (
            <div style={destinationHighlight}>
              <div style={{...label, color: TEAL, marginBottom: '8px'}}>The trip you are committing to</div>
              <div style={{fontSize: '18px', color: CHARCOAL, fontWeight: 700, lineHeight: 1.3}}>
                {destination}
              </div>
            </div>
          )}

          <p style={{...p, marginTop: '20px'}}>
            Three actions step you out of the bubble. Pick the ones you are committing to doing on this trip. One is enough. All three is bolder.
          </p>

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(false)} onClick={goNext}>
              Continue
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'commitments') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 4 · Lesson 2</div>
          <h1 style={h1}>What are you committing to?</h1>
          <p style={{...p, marginTop: '8px'}}>
            None of these are dangerous. All of them feel slightly uncomfortable before they happen. That discomfort is the stretch.
          </p>

          <hr style={hr} />

          <h2 style={h2}>Pick at least one. All three is bolder.</h2>
          <p style={{...p, fontSize: '14.5px', color: '#6B6B6B'}}>
            You can come back to your Compass before the trip and add more if you are ready.
          </p>

          <div style={{marginTop: '20px', marginBottom: '24px'}}>
            {commitments.map(c => {
              const selected = selectedCommitments.includes(c.id);
              const IconComp = c.icon;
              return (
                <button
                  key={c.id}
                  style={commitmentCard(selected)}
                  onClick={() => toggleCommitment(c.id)}
                >
                  <div style={iconCircle(selected)}>
                    <IconComp size={22} color={selected ? '#fff' : TEAL} />
                  </div>
                  <div style={{flex: 1, paddingTop: '2px'}}>
                    <div style={{fontSize: '15.5px', fontWeight: 600, color: CHARCOAL, marginBottom: '6px', lineHeight: 1.3}}>
                      {c.label}
                    </div>
                    <div style={{fontSize: '13.5px', color: '#6B6B6B', lineHeight: 1.55}}>
                      {c.desc}
                    </div>
                  </div>
                  <div style={checkBox(selected)}>
                    {selected && <IconCheck size={14} color="#fff" />}
                  </div>
                </button>
              );
            })}
          </div>

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(!canAdvanceFromCommitments)} onClick={goNext} disabled={!canAdvanceFromCommitments}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {!canAdvanceFromCommitments && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Pick at least one to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'save') {
      const count = selectedCommitments.length;
      const allThree = count === 3;

      return (
        <div style={card}>
          <Header />
          <div style={label}>Save your progress</div>
          <h1 style={h1}>
            {allThree ? 'All three. That is bold.' : count === 1 ? 'One commitment is real.' : `${count} commitments locked in.`}
          </h1>
          <p style={p}>
            You just committed to stepping outside the tourist bubble on {destination ? <strong style={{color: TEAL}}>{destination}</strong> : 'your trip'}. Real confidence comes from navigating the real version of a place, not the managed visitor-friendly version.
          </p>
          <blockquote style={blockquote}>
            Every time you figure something out in an unfamiliar environment, you collect proof that you can handle the unfamiliar.
          </blockquote>

          <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '20px'}}>
            The file will be saved as <strong style={{color: TEAL}}>BoldTraveler_Progress8.json</strong>. This is the file you will import in Module 4 Lesson 3.
          </p>

          <button style={primaryButton(false)} onClick={handleExport}>
            <IconDownload />
            Download my progress
          </button>

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'exported') {
      return (
        <React.Fragment>
          <div style={successCard}>
            <div style={{display: 'flex', justifyContent: 'center', marginBottom: '12px'}}>
              <IconSparkle size={32} color={GOLD} />
            </div>
            <h2 style={{...h2, color: TEAL, marginBottom: '10px'}}>Eight sections down.</h2>
            <p style={{...p, marginBottom: '6px'}}>
              <strong>BoldTraveler_Progress8.json</strong> has been saved to your device.
            </p>
            <p style={{...p, fontSize: '14.5px', marginBottom: 0}}>
              Your Compass now holds how you will move through {destination || 'your destination'}, not just where you are going. Three more sections until your Compass is complete.
            </p>
          </div>

          <div style={card}>
            <Header />
            <h2 style={h2}>Continue to Lesson 3</h2>
            <p style={p}>
              The next Compass moment is <em>The Longer Trip</em>. It is about duration and the very specific thing that happens around day four or five of a solo trip that never happens on a long weekend.
            </p>
            <a href={NEXT_LESSON_URL} target="_blank" rel="noopener noreferrer" style={successButton}>
              Take me to Lesson 3
              <IconArrowRight />
            </a>
            <hr style={hr} />
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Go back and review my answers
            </button>
            <div style={{minHeight: '32px'}}></div>
          </div>
        </React.Fragment>
      );
    }

    return null;
  };

  return (
    <React.Fragment>
      {showRestartConfirm && <RestartModal />}
      <div style={wrapStyle}>
        <div style={inner}>
          {renderPage()}
        </div>
      </div>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BoldTravelerCompassM4L2 />);
</script>
</body>
</html>
