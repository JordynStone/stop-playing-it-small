<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bold Traveler Compass — The Identity Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background:
      radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%),
      radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%),
      radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%),
      #F8F6F0;
    background-attachment: fixed;
  }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #3A3A3A;
    line-height: 1.6;
    min-height: 100vh;
  }
  button:not(:disabled):hover { transform: translateY(-2px); }
  button:not(:disabled):active { transform: translateY(0); }
  textarea:focus, input:focus { border-color: #D4A574 !important; outline: none;
    box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TEAL = '#2C5F5D';
const GOLD = '#D4A574';
const CREAM = '#F8F6F0';
const CORAL = '#E8A87C';
const CHARCOAL = '#3A3A3A';

const COMPANION_URL = 'https://www.skool.com/solo-and-fearless-3331/classroom/e6454d3e?md=3e4def20508442aea6004f8077ea7868';
const NEXT_LESSON_URL = 'https://www.skool.com/solo-and-fearless-3331/classroom/e6454d3e?md=9c1619d3026f4ef19c440c6a936a60c0';

const IconCompass = ({ size = 28, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  </svg>
);

const IconDownload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
);

const IconArrowRight = ({ size = 18, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  </svg>
);

const IconArrowLeft = ({ size = 18, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <polyline points="12 19 5 12 12 5"/>
  </svg>
);

const IconSparkle = ({ size = 18, color = GOLD }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
  </svg>
);

const IconHelp = ({ size = 16, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
    <line x1="12" y1="17" x2="12.01" y2="17"/>
  </svg>
);

const IconRefresh = ({ size = 20, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </svg>
);

const IconChevronDown = ({ size = 14, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="6 9 12 15 18 9"/>
  </svg>
);

const IconChevronUp = ({ size = 14, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
);

const identityOptions = [
  { id: 'past', label: 'I am someone who has done a solo trip' },
  { id: 'present', label: 'I am someone who travels solo' },
  { id: 'between', label: 'I am somewhere between the two' },
];

const stems = [
  'I am claiming the identity of a woman who travels solo because...',
  'The version of me who already knows this is true would say...',
  'The gap between who I was on my last trip and who I am becoming is...',
];

const PAGES = ['welcome', 'structured', 'written', 'save', 'exported'];

function BoldTravelerCompass() {
  const [pageIndex, setPageIndex] = useState(0);
  const [identityChoice, setIdentityChoice] = useState(null);
  const [showStems, setShowStems] = useState(false);
  const [writtenAnswer, setWrittenAnswer] = useState('');
  const [hasExported, setHasExported] = useState(false);
  const [showRestartConfirm, setShowRestartConfirm] = useState(false);

  const page = PAGES[pageIndex];

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [pageIndex]);

  const goNext = () => setPageIndex(i => Math.min(i + 1, PAGES.length - 1));
  const goBack = () => setPageIndex(i => Math.max(i - 1, 0));

  const handleRestart = () => setShowRestartConfirm(true);
  const cancelRestart = () => setShowRestartConfirm(false);
  const confirmRestart = () => {
    setPageIndex(0);
    setIdentityChoice(null);
    setShowStems(false);
    setWrittenAnswer('');
    setHasExported(false);
    setShowRestartConfirm(false);
  };

  const canAdvanceFromStructured = identityChoice !== null;

  const wrapStyle = {
    fontFamily: "'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif",
    background: 'radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%), radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%), radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%), ' + CREAM,
    backgroundAttachment: 'fixed',
    color: CHARCOAL,
    minHeight: '100vh',
    padding: '80px 32px 120px',
    lineHeight: 1.6,
  };

  const inner = { maxWidth: '720px', margin: '0 auto' };

  const card = {
    background: '#fff',
    borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '36px 32px 60px',
    boxShadow: '0 10px 30px rgba(44, 95, 93, 0.09)',
    marginBottom: '20px',
  };

  const headerBar = {
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'space-between',
    gap: '10px',
    marginBottom: '28px',
    paddingBottom: '20px',
    paddingTop: '4px',
    borderBottom: `1px solid ${GOLD}40`,
  };

  const headerLeft = { display: 'flex', alignItems: 'center', gap: '10px' };

  const headerTitle = {
    fontSize: '13px', fontWeight: 600, color: TEAL,
    letterSpacing: '1.2px', textTransform: 'uppercase',
  };

  const refreshBtn = {
    background: '#FFFFFF', border: '1px solid rgba(212,165,116,0.55)', color: TEAL,
    cursor: 'pointer', padding: '8px', borderRadius: '999px',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)',
    transition: 'transform .2s, box-shadow .2s',
  };

  const h1 = { fontSize: '26px', fontWeight: 700, color: TEAL, marginBottom: '8px', lineHeight: 1.25 };
  const h2 = { fontSize: '20px', fontWeight: 600, color: TEAL, marginBottom: '14px', lineHeight: 1.3 };
  const label = { fontSize: '12px', fontWeight: 600, color: GOLD, letterSpacing: '1.5px', textTransform: 'uppercase', marginBottom: '12px', display: 'block' };
  const p = { fontSize: '15.5px', color: CHARCOAL, marginBottom: '14px', lineHeight: 1.65 };
  const blockquote = { borderLeft: `3px solid ${GOLD}`, paddingLeft: '16px', fontSize: '15.5px', fontStyle: 'italic', color: CHARCOAL, margin: '16px 0', lineHeight: 1.6 };

  const optionButton = (selected) => ({
    width: '100%', textAlign: 'left', padding: '16px 18px', marginBottom: '10px',
    border: `2px solid ${selected ? TEAL : '#E5E0D5'}`,
    background: selected ? `${TEAL}0D` : '#fff',
    borderRadius: '14px', cursor: 'pointer', fontFamily: 'inherit', fontSize: '14.5px',
    color: CHARCOAL, fontWeight: selected ? 700 : 500,
    boxShadow: selected ? '0 8px 22px rgba(44,95,93,0.22)' : '0 10px 30px rgba(44,95,93,0.09)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s',
    display: 'flex', alignItems: 'center', gap: '12px',
  });

  const radioCircle = (selected) => ({
    width: '20px', height: '20px', borderRadius: '50%',
    border: `2px solid ${selected ? TEAL : '#C4BDB0'}`,
    background: selected ? TEAL : 'transparent', flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  });

  const radioDot = { width: '8px', height: '8px', borderRadius: '50%', background: '#fff' };

  const textareaStyle = {
    width: '100%', minHeight: '160px', padding: '14px 16px',
    border: '2px solid #E5E0D5', borderRadius: '10px', fontFamily: 'inherit',
    fontSize: '15px', color: CHARCOAL, resize: 'vertical', background: '#FDFCF7',
    lineHeight: 1.6, boxSizing: 'border-box',
  };

  const primaryButton = (disabled) => ({
    background: disabled ? '#C4BDB0' : 'linear-gradient(to bottom, #37716E, #2C5F5D)',
    color: '#fff', border: 'none',
    padding: '15px 26px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    boxShadow: disabled ? 'none' : '0 8px 22px rgba(44,95,93,0.32)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
  });

  const backButton = {
    background: '#FFFFFF', color: TEAL,
    border: '1px solid rgba(212,165,116,0.55)',
    padding: '14px 24px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
  };

  const successButton = {
    background: 'linear-gradient(to bottom, #E0B98A, #D4A574)', color: '#142E2C',
    border: 'none', padding: '15px 26px',
    borderRadius: '999px', fontFamily: 'inherit', fontSize: '15px', fontWeight: 700,
    cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '10px',
    boxShadow: '0 8px 22px rgba(212,165,116,0.45)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px', textDecoration: 'none',
  };

  const textButton = {
    background: '#FFFFFF', border: '1px solid rgba(212,165,116,0.55)', color: TEAL,
    fontFamily: 'inherit', fontSize: '13.5px', cursor: 'pointer',
    padding: '9px 18px', borderRadius: '999px', fontWeight: 700,
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)',
    transition: 'transform .2s, box-shadow .2s',
  };

  const stemBox = {
    background: `${CORAL}15`, border: `1px solid ${CORAL}40`,
    borderRadius: '10px', padding: '16px 18px', marginBottom: '14px',
    fontSize: '14px', color: CHARCOAL, lineHeight: 1.7,
  };

  const companionBox = {
    background: `${TEAL}08`, border: `1px solid ${TEAL}20`,
    borderRadius: '10px', padding: '16px 18px', marginTop: '16px', marginBottom: 0,
    fontSize: '13.5px', color: CHARCOAL, lineHeight: 1.6,
  };

  const companionLink = { color: TEAL, fontWeight: 600, textDecoration: 'underline' };
  const hr = { border: 'none', borderTop: `1px solid ${GOLD}40`, margin: '24px 0' };

  const navRow = {
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    gap: '12px', marginTop: '8px', marginBottom: '32px', flexWrap: 'wrap',
  };

  const successCard = {
    background: `${GOLD}15`, border: `2px solid ${GOLD}`,
    borderRadius: '12px', padding: '28px 24px', marginBottom: '20px', textAlign: 'center',
  };

  const modalOverlay = {
    position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
    background: 'rgba(58, 58, 58, 0.55)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    zIndex: 1000, padding: '24px',
  };

  const modalCard = {
    background: '#fff', borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '32px 28px', maxWidth: '440px', width: '100%',
    boxShadow: '0 20px 46px rgba(20, 46, 44, 0.4)',
  };

  const Header = () => (
    <div style={headerBar}>
      <div style={headerLeft}>
        <IconCompass size={22} />
        <div style={headerTitle}>Bold Traveler Compass</div>
      </div>
      <button style={refreshBtn} onClick={handleRestart} title="Start over" aria-label="Start over">
        <IconRefresh size={20} color={TEAL} />
      </button>
    </div>
  );

  const RestartModal = () => (
    <div style={modalOverlay} onClick={cancelRestart}>
      <div style={modalCard} onClick={(e) => e.stopPropagation()}>
        <h2 style={{...h2, marginBottom: '12px'}}>Start over?</h2>
        <p style={p}>
          This will clear everything you have filled in on this page and bring you back to the beginning. Anything you have not downloaded yet will be lost.
        </p>
        <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '24px'}}>
          If you have already downloaded a progress file, you can import it again next time to pick up where you left off.
        </p>
        <div style={{display: 'flex', gap: '12px', justifyContent: 'flex-end', flexWrap: 'wrap'}}>
          <button style={backButton} onClick={cancelRestart}>Keep my answers</button>
          <button style={{...primaryButton(false), background: CORAL}} onClick={confirmRestart}>
            Yes, start over
          </button>
        </div>
      </div>
    </div>
  );

  const handleExport = () => {
    const choiceLabel = identityOptions.find(o => o.id === identityChoice)?.label || '';
    const data = {
      compass: 'Bold Traveler Compass',
      course: 'Stop Playing It Small',
      version: 1,
      lastCompleted: 'Module 1 Lesson 2 — The Identity Shift at the Next Level',
      timestamp: new Date().toISOString(),
      sections: {
        identityShift: {
          structuredChoice: choiceLabel,
          writtenExpansion: writtenAnswer.trim(),
        },
      },
    };

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'BoldTraveler_Progress1.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setHasExported(true);
    goNext();
  };

  const renderPage = () => {
    if (page === 'welcome') {
      return (
        <div style={{...card, textAlign: 'center', paddingTop: '40px', paddingBottom: '40px'}}>
          <div style={{display: 'flex', justifyContent: 'center', marginBottom: '20px'}}>
            <IconCompass size={48} />
          </div>
          <div style={label}>Stop Playing It Small</div>
          <h1 style={{...h1, fontSize: '30px', textAlign: 'center'}}>The Bold Traveler Compass</h1>
          <p style={{...p, marginTop: '16px'}}>
            This is where you build your Compass across the course. One section at a time. Each module adds a layer until you have a complete document that belongs to you.
          </p>
          <hr style={hr} />
          <p style={{...p, textAlign: 'left', marginBottom: '12px'}}>
            <strong style={{color: TEAL}}>How it works.</strong> You complete each section, you download your progress, you bring that file back next time. Your answers travel with you on any device.
          </p>
          <p style={{...p, textAlign: 'left', marginBottom: '12px'}}>
            <strong style={{color: TEAL}}>You own the file.</strong> Nothing is saved anywhere except on your device. No login. No account. Just the file.
          </p>
          <p style={{...p, textAlign: 'left'}}>
            <strong style={{color: TEAL}}>At the end of the course</strong> your Compass becomes a designed PDF you keep. Your Bold Traveler Compass, in your hands.
          </p>
          <hr style={hr} />
          <button style={{...primaryButton(false), marginTop: '8px'}} onClick={goNext}>
            Begin your Compass
            <IconArrowRight />
          </button>
        </div>
      );
    }

    if (page === 'structured') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 1 · Lesson 2</div>
          <h1 style={h1}>The Identity Shift</h1>
          <p style={{...p, marginTop: '8px'}}>
            A solo traveler does not describe herself in the past tense. She describes herself in the present. This is where you decide which one you are claiming.
          </p>
          <hr style={hr} />
          <h2 style={h2}>Right now, which feels more true?</h2>
          <p style={{...p, fontSize: '14.5px', color: '#6B6B6B'}}>
            Pick the one closest to where you are today. Not where you want to be. Where you actually are.
          </p>
          <div style={{marginTop: '16px', marginBottom: '24px'}}>
            {identityOptions.map(opt => (
              <button
                key={opt.id}
                style={optionButton(identityChoice === opt.id)}
                onClick={() => setIdentityChoice(opt.id)}
              >
                <div style={radioCircle(identityChoice === opt.id)}>
                  {identityChoice === opt.id && <div style={radioDot}></div>}
                </div>
                {opt.label}
              </button>
            ))}
          </div>
          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button
              style={primaryButton(!canAdvanceFromStructured)}
              onClick={goNext}
              disabled={!canAdvanceFromStructured}
            >
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {!canAdvanceFromStructured && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Choose one of the three options to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'written') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>In your own words</div>
          <h1 style={h1}>Claim it.</h1>
          <p style={p}>
            Write a few sentences about the identity you are claiming. This is the foundation of your Compass. Everything else builds on it.
          </p>
          <p style={{...p, fontSize: '14px', color: '#6B6B6B'}}>
            This part is encouraged but not required. Your structured answer is already saved.
          </p>
          <div style={{marginBottom: '14px'}}>
            <button style={textButton} onClick={() => setShowStems(s => !s)}>
              <span style={{display: 'inline-flex', alignItems: 'center', gap: '6px'}}>
                <IconHelp size={14} color={TEAL} />
                {showStems ? 'Hide examples' : 'Show me some examples'}
                {showStems ? <IconChevronUp size={12} /> : <IconChevronDown size={12} />}
              </span>
            </button>
          </div>
          {showStems && (
            <div style={stemBox}>
              <strong style={{color: TEAL, display: 'block', marginBottom: '8px', fontSize: '13px', letterSpacing: '0.5px'}}>
                TRY ONE OF THESE OPENERS
              </strong>
              {stems.map((s, i) => (
                <div key={i} style={{marginBottom: i < stems.length - 1 ? '8px' : 0, fontStyle: 'italic'}}>
                  · {s}
                </div>
              ))}
            </div>
          )}
          <textarea
            style={textareaStyle}
            placeholder="Write here..."
            value={writtenAnswer}
            onChange={(e) => setWrittenAnswer(e.target.value)}
          />
          <div style={companionBox}>
            <strong style={{color: TEAL}}>Stuck on this one?</strong> Some answers do not come on the first try. Jordyn's Bold Travel Companion can help you talk it through, then come back here and write what you landed on.
            <div style={{marginTop: '10px'}}>
              <a href={COMPANION_URL} target="_blank" rel="noopener noreferrer" style={companionLink}>
                Get access to Jordyn's Bold Travel Companion →
              </a>
            </div>
          </div>
          <hr style={hr} />
          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(false)} onClick={goNext}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'save') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Save your progress</div>
          <h1 style={h1}>Lock in what you just built.</h1>
          <p style={p}>
            Your Compass has its first section. Save it now so you never lose what you just built.
          </p>
          <blockquote style={blockquote}>
            You will bring this file back in the next lesson and add the next layer. Each export is a piece of the Compass you are building.
          </blockquote>
          <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '20px'}}>
            The file will be saved as <strong style={{color: TEAL}}>BoldTraveler_Progress1.json</strong>. Keep it somewhere you can find it again.
          </p>
          <button style={primaryButton(false)} onClick={handleExport}>
            <IconDownload />
            Download my progress
          </button>
          <hr style={hr} />
          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'exported') {
      return (
        <React.Fragment>
          <div style={successCard}>
            <div style={{display: 'flex', justifyContent: 'center', marginBottom: '12px'}}>
              <IconSparkle size={32} color={GOLD} />
            </div>
            <h2 style={{...h2, color: TEAL, marginBottom: '10px'}}>Your Compass has its first section.</h2>
            <p style={{...p, marginBottom: '6px'}}>
              <strong>BoldTraveler_Progress1.json</strong> has been saved to your device.
            </p>
            <p style={{...p, fontSize: '14.5px', marginBottom: 0}}>
              Keep this file somewhere you will find it again. You will import it in the next lesson and add the next layer.
            </p>
          </div>
          <div style={card}>
            <Header />
            <h2 style={h2}>Continue to Lesson 3</h2>
            <p style={p}>
              The next lesson is <em>What Playing It Small Is Actually Costing You</em>. When you reach the Compass moment in that lesson, you will import the file you just saved and pick up exactly where you left off.
            </p>
            <a href={NEXT_LESSON_URL} target="_blank" rel="noopener noreferrer" style={successButton}>
              Take me to Lesson 3
              <IconArrowRight />
            </a>
            <hr style={hr} />
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Go back and review my answers
            </button>
            <div style={{minHeight: '32px'}}></div>
          </div>
        </React.Fragment>
      );
    }

    return null;
  };

  return (
    <React.Fragment>
      {showRestartConfirm && <RestartModal />}
      <div style={wrapStyle}>
        <div style={inner}>
          {renderPage()}
        </div>
      </div>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BoldTravelerCompass />);
</script>
</body>
</html>
