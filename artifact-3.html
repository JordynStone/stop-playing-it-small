<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bold Traveler Compass — Stop Choosing with Last Year's Self</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background:
      radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%),
      radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%),
      radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%),
      #F8F6F0;
    background-attachment: fixed;
  }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #3A3A3A;
    line-height: 1.6;
    min-height: 100vh;
  }
  button:not(:disabled):hover { transform: translateY(-2px); }
  button:not(:disabled):active { transform: translateY(0); }
  textarea:focus, input:focus { border-color: #D4A574 !important; outline: none;
    box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TEAL = '#2C5F5D';
const GOLD = '#D4A574';
const CREAM = '#F8F6F0';
const CORAL = '#E8A87C';
const CHARCOAL = '#3A3A3A';

const NEXT_LESSON_URL = 'https://www.skool.com/solo-and-fearless-3331/classroom/e6454d3e?md=b584b12d174b47e187aa8cc43ee3531b';

const IconCompass = ({ size = 28, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  </svg>
);

const IconDownload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
);

const IconUpload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
);

const IconArrowRight = ({ size = 18, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  </svg>
);

const IconArrowLeft = ({ size = 18, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <polyline points="12 19 5 12 12 5"/>
  </svg>
);

const IconSparkle = ({ size = 18, color = GOLD }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
  </svg>
);

const IconRefresh = ({ size = 20, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </svg>
);

const IconCheckCircle = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  </svg>
);

const IconCheck = ({ size = 14, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
);

const lessonOptions = [
  { id: 'navigate', label: 'I can navigate the unexpected when it actually happens' },
  { id: 'discomfort', label: 'I can be uncomfortable in an unfamiliar place and still be okay' },
  { id: 'capable', label: 'The version of me who shows up abroad is more capable than the version at home' },
  { id: 'figure_out', label: 'I can figure things out without a plan that covers everything' },
  { id: 'language', label: 'Language barriers are friction, not a wall' },
  { id: 'alone', label: 'Being alone in a new place is not the same as being lonely' },
  { id: 'other', label: 'Something else I learned' },
];

const fearOptions = [
  { id: 'language', label: 'Language barriers' },
  { id: 'distance', label: 'Being further from home' },
  { id: 'culture', label: 'Unfamiliar culture, food, or customs' },
  { id: 'alone', label: 'Being truly alone with no safety net' },
  { id: 'longer', label: 'A longer trip than I have done before' },
  { id: 'transport', label: 'Navigating unfamiliar transport systems' },
  { id: 'other', label: 'A different specific fear' },
];

const intensityLevels = [
  { id: 'low', label: 'Low', score: 1 },
  { id: 'med-low', label: 'Medium-Low', score: 2 },
  { id: 'med-high', label: 'Medium-High', score: 3 },
  { id: 'high', label: 'High', score: 4 },
];

const PAGES = ['import', 'continuity', 'question1', 'fearsSelect', 'fearsRank', 'fearsConfirm', 'save', 'exported'];

function BoldTravelerCompassM2L1() {
  const [pageIndex, setPageIndex] = useState(0);
  const [importedData, setImportedData] = useState(null);
  const [importError, setImportError] = useState(null);
  const [selectedLessons, setSelectedLessons] = useState([]);
  const [selectedFears, setSelectedFears] = useState([]);
  const [customFearText, setCustomFearText] = useState('');
  const [fearScores, setFearScores] = useState({});
  const [tieBreakChoice, setTieBreakChoice] = useState(null);
  const [hasExported, setHasExported] = useState(false);
  const [showRestartConfirm, setShowRestartConfirm] = useState(false);
  const fileInputRef = useRef(null);

  const page = PAGES[pageIndex];

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [pageIndex]);

  const goNext = () => {
    if (page === 'fearsSelect' && selectedFears.length === 1) {
      setPageIndex(PAGES.indexOf('fearsConfirm'));
      return;
    }
    setPageIndex(i => Math.min(i + 1, PAGES.length - 1));
  };

  const goBack = () => {
    if (page === 'fearsConfirm' && selectedFears.length === 1) {
      setPageIndex(PAGES.indexOf('fearsSelect'));
      return;
    }
    setPageIndex(i => Math.max(i - 1, 0));
  };

  const handleRestart = () => setShowRestartConfirm(true);
  const cancelRestart = () => setShowRestartConfirm(false);
  const confirmRestart = () => {
    setPageIndex(0);
    setImportedData(null);
    setImportError(null);
    setSelectedLessons([]);
    setSelectedFears([]);
    setCustomFearText('');
    setFearScores({});
    setTieBreakChoice(null);
    setHasExported(false);
    setShowRestartConfirm(false);
  };

  const toggleLesson = (id) => {
    setSelectedLessons(prev =>
      prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
    );
  };

  const toggleFear = (id) => {
    setSelectedFears(prev => {
      const next = prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id];
      setFearScores(scores => {
        const cleaned = {};
        next.forEach(fid => { if (scores[fid] !== undefined) cleaned[fid] = scores[fid]; });
        return cleaned;
      });
      setTieBreakChoice(null);
      return next;
    });
    if (id === 'other' && selectedFears.includes('other')) {
      setCustomFearText('');
    }
  };

  const setFearScore = (fearId, score) => {
    setFearScores(prev => ({ ...prev, [fearId]: score }));
    setTieBreakChoice(null);
  };

  const handleFileImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.name.endsWith('.json')) {
      setImportError('That does not look like a Compass progress file. It should end in .json');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.sections || !data.sections.identityShift || !data.sections.costOfStayingSmall) {
          setImportError('This file is missing answers from earlier lessons. Make sure you are importing the BoldTraveler_Progress2.json file from Lesson 3.');
          return;
        }
        setImportedData(data);
        setImportError(null);
        goNext();
      } catch (err) {
        setImportError('Could not read this file. It may be corrupted. Try downloading it again from Lesson 3.');
      }
    };
    reader.readAsText(file);
  };

  const getFearLabel = (id) => {
    if (id === 'other' && customFearText.trim()) return customFearText.trim();
    return fearOptions.find(o => o.id === id)?.label || '';
  };

  const getTopFears = () => {
    if (selectedFears.length === 0) return [];
    if (selectedFears.length === 1) return [selectedFears[0]];
    const maxScore = Math.max(...selectedFears.map(id => fearScores[id] || 0));
    return selectedFears.filter(id => (fearScores[id] || 0) === maxScore);
  };

  const topFears = getTopFears();
  const hasTie = topFears.length > 1 && selectedFears.length > 1;
  const winningFear = hasTie ? tieBreakChoice : topFears[0];

  const canAdvanceFromQ1 = selectedLessons.length > 0;
  const otherSelected = selectedFears.includes('other');
  const canAdvanceFromFearsSelect =
    selectedFears.length > 0 &&
    (!otherSelected || customFearText.trim().length > 0);
  const allFearsScored = selectedFears.every(id => fearScores[id] !== undefined);
  const canAdvanceFromFearsRank = allFearsScored;
  const canAdvanceFromConfirm = !hasTie || tieBreakChoice !== null;

  const wrapStyle = {
    fontFamily: "'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif",
    background: 'radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%), radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%), radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%), ' + CREAM,
    backgroundAttachment: 'fixed', color: CHARCOAL,
    minHeight: '100vh', padding: '80px 32px 120px', lineHeight: 1.6,
  };

  const inner = { maxWidth: '720px', margin: '0 auto' };

  const card = {
    background: '#fff',
    borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '36px 32px 60px',
    boxShadow: '0 10px 30px rgba(44, 95, 93, 0.09)',
    marginBottom: '20px',
  };

  const headerBar = {
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    gap: '10px', marginBottom: '24px', paddingBottom: '14px',
    borderBottom: `1px solid ${GOLD}40`,
  };

  const headerLeft = { display: 'flex', alignItems: 'center', gap: '10px' };

  const headerTitle = {
    fontSize: '13px', fontWeight: 600, color: TEAL,
    letterSpacing: '1.2px', textTransform: 'uppercase',
  };

  const refreshBtn = {
    background: '#FFFFFF', border: '1px solid rgba(212,165,116,0.55)', color: TEAL,
    cursor: 'pointer', padding: '8px', borderRadius: '999px',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)',
    transition: 'transform .2s, box-shadow .2s',
  };

  const h1 = { fontSize: '26px', fontWeight: 700, color: TEAL, marginBottom: '8px', lineHeight: 1.25 };
  const h2 = { fontSize: '20px', fontWeight: 600, color: TEAL, marginBottom: '14px', lineHeight: 1.3 };
  const label = { fontSize: '12px', fontWeight: 600, color: GOLD, letterSpacing: '1.5px', textTransform: 'uppercase', marginBottom: '12px', display: 'block' };
  const p = { fontSize: '15.5px', color: CHARCOAL, marginBottom: '14px', lineHeight: 1.65 };
  const blockquote = { borderLeft: `3px solid ${GOLD}`, paddingLeft: '16px', fontSize: '15.5px', fontStyle: 'italic', color: CHARCOAL, margin: '16px 0', lineHeight: 1.6 };

  const optionButton = (selected) => ({
    width: '100%', textAlign: 'left', padding: '16px 18px', marginBottom: '10px',
    border: `2px solid ${selected ? TEAL : '#E5E0D5'}`,
    background: selected ? `${TEAL}0D` : '#fff',
    borderRadius: '14px', cursor: 'pointer', fontFamily: 'inherit', fontSize: '14.5px',
    color: CHARCOAL, fontWeight: selected ? 700 : 500,
    boxShadow: selected ? '0 8px 22px rgba(44,95,93,0.22)' : '0 10px 30px rgba(44,95,93,0.09)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s',
    display: 'flex', alignItems: 'center', gap: '12px',
  });

  const radioCircle = (selected) => ({
    width: '20px', height: '20px', borderRadius: '50%',
    border: `2px solid ${selected ? TEAL : '#C4BDB0'}`,
    background: selected ? TEAL : 'transparent', flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  });

  const radioDot = { width: '8px', height: '8px', borderRadius: '50%', background: '#fff' };

  const checkBox = (selected) => ({
    width: '20px', height: '20px', borderRadius: '4px',
    border: `2px solid ${selected ? TEAL : '#C4BDB0'}`,
    background: selected ? TEAL : 'transparent', flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  });

  const customInput = {
    width: '100%', padding: '12px 14px',
    border: '2px solid #E5E0D5', borderRadius: '10px',
    fontFamily: 'inherit', fontSize: '14.5px', color: CHARCOAL,
    background: '#FDFCF7', boxSizing: 'border-box', marginTop: '4px',
  };

  const primaryButton = (disabled) => ({
    background: disabled ? '#C4BDB0' : 'linear-gradient(to bottom, #37716E, #2C5F5D)',
    color: '#fff', border: 'none',
    padding: '15px 26px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    boxShadow: disabled ? 'none' : '0 8px 22px rgba(44,95,93,0.32)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
  });

  const backButton = {
    background: '#FFFFFF', color: TEAL,
    border: '1px solid rgba(212,165,116,0.55)',
    padding: '14px 24px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
  };

  const successButton = {
    background: 'linear-gradient(to bottom, #E0B98A, #D4A574)', color: '#142E2C',
    border: 'none', padding: '15px 26px',
    borderRadius: '999px', fontFamily: 'inherit', fontSize: '15px', fontWeight: 700,
    cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '10px',
    boxShadow: '0 8px 22px rgba(212,165,116,0.45)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px', textDecoration: 'none',
  };

  const hr = { border: 'none', borderTop: `1px solid ${GOLD}40`, margin: '24px 0' };

  const navRow = {
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    gap: '12px', marginTop: '8px', marginBottom: '32px', flexWrap: 'wrap',
  };

  const successCard = {
    background: `${GOLD}15`, border: `2px solid ${GOLD}`,
    borderRadius: '12px', padding: '28px 24px', marginBottom: '20px', textAlign: 'center',
  };

  const continuityCard = {
    background: `${TEAL}08`, border: `1px solid ${TEAL}25`,
    borderRadius: '10px', padding: '20px 22px',
    marginTop: '20px', marginBottom: '12px',
  };

  const winnerCard = {
    background: `${GOLD}15`, border: `2px solid ${GOLD}`,
    borderRadius: '10px', padding: '24px 22px',
    marginTop: '20px', marginBottom: '20px', textAlign: 'center',
  };

  const errorBox = {
    background: `${CORAL}20`, border: `1px solid ${CORAL}`,
    borderRadius: '8px', padding: '12px 16px',
    fontSize: '14px', color: CHARCOAL, marginBottom: '16px',
  };

  const modalOverlay = {
    position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
    background: 'rgba(58, 58, 58, 0.55)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    zIndex: 1000, padding: '24px',
  };

  const modalCard = {
    background: '#fff', borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '32px 28px', maxWidth: '440px', width: '100%',
    boxShadow: '0 20px 46px rgba(20, 46, 44, 0.4)',
  };

  const intensityColors = {
    'low': TEAL,
    'med-low': '#7A8E5C',
    'med-high': GOLD,
    'high': CORAL,
  };

  const intensityBtn = (level, selected) => ({
    flex: 1, minWidth: 0,
    padding: '13px 8px', borderRadius: '999px',
    border: `2px solid ${selected ? intensityColors[level.id] : '#E5E0D5'}`,
    background: selected ? intensityColors[level.id] : '#fff',
    color: selected ? '#fff' : CHARCOAL,
    fontFamily: 'inherit', fontSize: '12.5px',
    fontWeight: selected ? 700 : 600,
    cursor: 'pointer',
    boxShadow: selected ? '0 8px 22px rgba(44,95,93,0.28)' : '0 10px 30px rgba(44,95,93,0.09)',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s',
    textAlign: 'center', lineHeight: 1.2,
  });

  const fearRankCard = {
    background: '#FDFCF7', border: '1px solid #E5E0D5',
    borderRadius: '10px', padding: '18px 18px 20px', marginBottom: '14px',
  };

  const Header = () => (
    <div style={headerBar}>
      <div style={headerLeft}>
        <IconCompass size={22} />
        <div style={headerTitle}>Bold Traveler Compass</div>
      </div>
      <button style={refreshBtn} onClick={handleRestart} title="Start over" aria-label="Start over">
        <IconRefresh size={20} color={TEAL} />
      </button>
    </div>
  );

  const RestartModal = () => (
    <div style={modalOverlay} onClick={cancelRestart}>
      <div style={modalCard} onClick={(e) => e.stopPropagation()}>
        <h2 style={{...h2, marginBottom: '12px'}}>Start over?</h2>
        <p style={p}>
          This will clear everything you have filled in on this page and bring you back to the beginning. Anything you have not downloaded yet will be lost.
        </p>
        <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '24px'}}>
          If you have already downloaded a progress file, you can import it again next time to pick up where you left off.
        </p>
        <div style={{display: 'flex', gap: '12px', justifyContent: 'flex-end', flexWrap: 'wrap'}}>
          <button style={backButton} onClick={cancelRestart}>Keep my answers</button>
          <button style={{...primaryButton(false), background: CORAL}} onClick={confirmRestart}>
            Yes, start over
          </button>
        </div>
      </div>
    </div>
  );

  const handleExport = () => {
    const lessonLabels = selectedLessons.map(id => lessonOptions.find(o => o.id === id)?.label).filter(Boolean);

    const allFears = selectedFears.map(id => ({
      fear: getFearLabel(id),
      intensity: selectedFears.length > 1
        ? (intensityLevels.find(l => l.score === fearScores[id])?.label || 'Not rated')
        : 'Single selection',
    }));

    const updatedData = {
      ...importedData,
      version: (importedData?.version || 1) + 1,
      lastCompleted: 'Module 2 Lesson 1 — Stop Choosing with Last Year\'s Self',
      timestamp: new Date().toISOString(),
      sections: {
        ...importedData.sections,
        lastTripLessons: {
          lessonsLearned: lessonLabels,
          allFears: allFears,
          primarySpecificFear: getFearLabel(winningFear),
        },
      },
    };

    const blob = new Blob([JSON.stringify(updatedData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'BoldTraveler_Progress3.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setHasExported(true);
    setPageIndex(PAGES.indexOf('exported'));
  };

  const renderPage = () => {
    if (page === 'import') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Welcome back</div>
          <h1 style={h1}>Bring your Compass with you.</h1>
          <p style={p}>
            You added the second section to your Compass in Lesson 3. To continue from where you left off, import the progress file you saved.
          </p>
          <p style={{...p, fontSize: '14px', color: '#6B6B6B'}}>
            Look for <strong style={{color: TEAL}}>BoldTraveler_Progress2.json</strong> on your device. It is the file you downloaded last time.
          </p>

          {importError && <div style={errorBox}>{importError}</div>}

          <div style={{marginTop: '20px', marginBottom: '12px'}}>
            <input
              ref={fileInputRef}
              type="file"
              accept=".json,application/json"
              onChange={handleFileImport}
              style={{display: 'none'}}
            />
            <button style={primaryButton(false)} onClick={() => fileInputRef.current?.click()}>
              <IconUpload />
              Choose my progress file
            </button>
          </div>

          <hr style={hr} />

          <div style={{...p, fontSize: '13.5px', color: '#6B6B6B', marginBottom: 0}}>
            <strong style={{color: TEAL}}>Cannot find the file?</strong> No problem. Go back to Lesson 3, complete it, and download the file from there. Then come back here.
          </div>
          <div style={{minHeight: '24px'}}></div>
        </div>
      );
    }

    if (page === 'continuity') {
      const identityChoice = importedData?.sections?.identityShift?.structuredChoice || '';
      const costChoice = importedData?.sections?.costOfStayingSmall?.structuredChoice || '';

      return (
        <div style={card}>
          <Header />
          <div style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px'}}>
            <IconCheckCircle size={22} color={TEAL} />
            <div style={{...label, marginBottom: 0, color: TEAL}}>Progress restored</div>
          </div>
          <h1 style={h1}>Welcome back.</h1>
          <p style={p}>
            Your Compass is loaded. Here is what you have built so far.
          </p>

          <div style={continuityCard}>
            <div style={{...label, color: TEAL, marginBottom: '8px'}}>The identity you claimed</div>
            <div style={{fontSize: '15.5px', color: CHARCOAL, fontWeight: 600}}>{identityChoice}</div>
          </div>

          <div style={continuityCard}>
            <div style={{...label, color: TEAL, marginBottom: '8px'}}>The cost of staying small</div>
            <div style={{fontSize: '15.5px', color: CHARCOAL, fontWeight: 600}}>{costChoice}</div>
          </div>

          <p style={{...p, marginTop: '20px'}}>
            Now Module 2 begins. The destination work. Before you choose where to go next, you are going to be honest about two things.
          </p>

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(false)} onClick={goNext}>
              Continue
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'question1') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 2 · Lesson 1</div>
          <h1 style={h1}>What your last trip actually taught you.</h1>
          <p style={{...p, marginTop: '8px'}}>
            Not what it was supposed to teach you. What it actually changed about how you move through unfamiliar spaces.
          </p>

          <hr style={hr} />

          <h2 style={h2}>Which of these did your last trip prove to you?</h2>
          <p style={{...p, fontSize: '14.5px', color: '#6B6B6B'}}>
            Pick all that apply. Each one is real evidence you can transfer to the next decision.
          </p>

          <div style={{marginTop: '16px', marginBottom: '24px'}}>
            {lessonOptions.map(opt => {
              const selected = selectedLessons.includes(opt.id);
              return (
                <button
                  key={opt.id}
                  style={optionButton(selected)}
                  onClick={() => toggleLesson(opt.id)}
                >
                  <div style={checkBox(selected)}>
                    {selected && <IconCheck size={14} color="#fff" />}
                  </div>
                  {opt.label}
                </button>
              );
            })}
          </div>

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(!canAdvanceFromQ1)} onClick={goNext} disabled={!canAdvanceFromQ1}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {!canAdvanceFromQ1 && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Pick at least one to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'fearsSelect') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 2 · Lesson 1</div>
          <h1 style={h1}>The fears behind the comfort zone creep.</h1>
          <p style={{...p, marginTop: '8px'}}>
            The fear narrowing your options is rarely just one thing. Most women have a combination. Name all of them honestly, and the Compass will help you find the one running the show.
          </p>

          <hr style={hr} />

          <h2 style={h2}>Which of these fears feel real to you right now?</h2>
          <p style={{...p, fontSize: '14.5px', color: '#6B6B6B'}}>
            Pick all that apply. There is no quota. Pick one, pick five. The honest answer is what matters.
          </p>

          <div style={{marginTop: '16px', marginBottom: '24px'}}>
            {fearOptions.map(opt => {
              const selected = selectedFears.includes(opt.id);
              return (
                <div key={opt.id}>
                  <button style={optionButton(selected)} onClick={() => toggleFear(opt.id)}>
                    <div style={checkBox(selected)}>
                      {selected && <IconCheck size={14} color="#fff" />}
                    </div>
                    {opt.label}
                  </button>
                  {opt.id === 'other' && selected && (
                    <div style={{marginTop: '-4px', marginBottom: '12px', paddingLeft: '4px', paddingRight: '4px'}}>
                      <p style={{...p, fontSize: '13.5px', color: '#6B6B6B', marginBottom: '8px'}}>
                        Name your specific fear. <strong style={{color: TEAL}}>One fear only</strong>, not a list. The more specific you can be, the more useful this becomes in Module 2 Lesson 4.
                      </p>
                      <input
                        type="text"
                        style={customInput}
                        placeholder="e.g. Getting sick somewhere I do not speak the language"
                        value={customFearText}
                        onChange={(e) => setCustomFearText(e.target.value)}
                        maxLength={120}
                      />
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(!canAdvanceFromFearsSelect)} onClick={goNext} disabled={!canAdvanceFromFearsSelect}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {selectedFears.length === 0 && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Pick at least one fear to continue.
              </p>
            )}
            {otherSelected && customFearText.trim().length === 0 && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Name your specific fear to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'fearsRank') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 2 · Lesson 1</div>
          <h1 style={h1}>Rate the heat of each one.</h1>
          <p style={{...p, marginTop: '8px'}}>
            You named {selectedFears.length} fears. Now rate how loud each one actually is in your destination decisions. The Compass will identify the one running the show.
          </p>

          <hr style={hr} />

          <div style={{marginTop: '8px', marginBottom: '24px'}}>
            {selectedFears.map(fearId => {
              const currentScore = fearScores[fearId];
              return (
                <div key={fearId} style={fearRankCard}>
                  <div style={{fontSize: '15px', fontWeight: 600, color: CHARCOAL, marginBottom: '12px'}}>
                    {getFearLabel(fearId)}
                  </div>
                  <div style={{display: 'flex', gap: '8px'}}>
                    {intensityLevels.map(level => (
                      <button
                        key={level.id}
                        style={intensityBtn(level, currentScore === level.score)}
                        onClick={() => setFearScore(fearId, level.score)}
                      >
                        {level.label}
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(!canAdvanceFromFearsRank)} onClick={goNext} disabled={!canAdvanceFromFearsRank}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {!canAdvanceFromFearsRank && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Rate every fear to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'fearsConfirm') {
      const singleFear = selectedFears.length === 1;

      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 2 · Lesson 1</div>
          <h1 style={h1}>{singleFear ? 'The fear running the show.' : (hasTie ? 'A close one.' : 'The fear running the show.')}</h1>

          {singleFear && (
            <React.Fragment>
              <p style={{...p, marginTop: '8px'}}>
                You named one specific fear. That is the one Module 2 Lesson 4 is going to use when you choose your next destination.
              </p>
              <div style={winnerCard}>
                <div style={{...label, color: TEAL, marginBottom: '10px'}}>Your primary specific fear</div>
                <div style={{fontSize: '18px', fontWeight: 700, color: TEAL, lineHeight: 1.3}}>
                  {getFearLabel(selectedFears[0])}
                </div>
              </div>
            </React.Fragment>
          )}

          {!singleFear && !hasTie && (
            <React.Fragment>
              <p style={{...p, marginTop: '8px'}}>
                Based on how you rated them, here is the fear that is loudest in your destination decisions right now. This is the one Module 2 Lesson 4 is going to use.
              </p>
              <div style={winnerCard}>
                <div style={{...label, color: TEAL, marginBottom: '10px'}}>Your primary specific fear</div>
                <div style={{fontSize: '18px', fontWeight: 700, color: TEAL, lineHeight: 1.3}}>
                  {getFearLabel(topFears[0])}
                </div>
              </div>
              <p style={{...p, fontSize: '14px', color: '#6B6B6B'}}>
                The other fears you named are saved in your Compass too. Module 2 Lesson 4 will focus on this one because it is the strongest, but the others will be there when you are ready to address them.
              </p>
            </React.Fragment>
          )}

          {hasTie && (
            <React.Fragment>
              <p style={{...p, marginTop: '8px'}}>
                You rated {topFears.length} fears equally. The Compass needs one specific fear for Module 2 Lesson 4. Which one do you want to address first?
              </p>
              <div style={{marginTop: '16px', marginBottom: '20px'}}>
                {topFears.map(fearId => (
                  <button
                    key={fearId}
                    style={optionButton(tieBreakChoice === fearId)}
                    onClick={() => setTieBreakChoice(fearId)}
                  >
                    <div style={radioCircle(tieBreakChoice === fearId)}>
                      {tieBreakChoice === fearId && <div style={radioDot}></div>}
                    </div>
                    {getFearLabel(fearId)}
                  </button>
                ))}
              </div>
              {tieBreakChoice && (
                <div style={winnerCard}>
                  <div style={{...label, color: TEAL, marginBottom: '10px'}}>Your primary specific fear</div>
                  <div style={{fontSize: '18px', fontWeight: 700, color: TEAL, lineHeight: 1.3}}>
                    {getFearLabel(tieBreakChoice)}
                  </div>
                </div>
              )}
            </React.Fragment>
          )}

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(!canAdvanceFromConfirm)} onClick={goNext} disabled={!canAdvanceFromConfirm}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {hasTie && !tieBreakChoice && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Pick one to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'save') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Save your progress</div>
          <h1 style={h1}>You just named what was hidden.</h1>
          <p style={p}>
            The proof you already have. The fears that have been making your destination decisions for you. The one that is loudest. All of it is now in your Compass.
          </p>
          <blockquote style={blockquote}>
            The Stretch Trip Formula in the next lesson is going to use what you just named.
          </blockquote>

          <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '20px'}}>
            The file will be saved as <strong style={{color: TEAL}}>BoldTraveler_Progress3.json</strong>. This is the file you will import in the next lesson with a Compass moment.
          </p>

          <button style={primaryButton(false)} onClick={handleExport}>
            <IconDownload />
            Download my progress
          </button>

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'exported') {
      return (
        <React.Fragment>
          <div style={successCard}>
            <div style={{display: 'flex', justifyContent: 'center', marginBottom: '12px'}}>
              <IconSparkle size={32} color={GOLD} />
            </div>
            <h2 style={{...h2, color: TEAL, marginBottom: '10px'}}>Three sections down.</h2>
            <p style={{...p, marginBottom: '6px'}}>
              <strong>BoldTraveler_Progress3.json</strong> has been saved to your device.
            </p>
            <p style={{...p, fontSize: '14.5px', marginBottom: 0}}>
              Your Compass now holds the identity you are claiming, the cost of not claiming it, the proof from your last trip, and the fear that has been running the show.
            </p>
          </div>

          <div style={card}>
            <Header />
            <h2 style={h2}>Continue to Lesson 2</h2>
            <p style={p}>
              The next lesson is <em>The Stretch Trip Formula</em>. It teaches the framework you will use to choose your next destination. There is no Compass moment in that lesson, but it sets up the big destination capture in Lesson 4.
            </p>
            <a href={NEXT_LESSON_URL} target="_blank" rel="noopener noreferrer" style={successButton}>
              Take me to Lesson 2
              <IconArrowRight />
            </a>
            <hr style={hr} />
            <button style={backButton} onClick={() => setPageIndex(PAGES.indexOf('save'))}>
              <IconArrowLeft />
              Go back and review my answers
            </button>
            <div style={{minHeight: '32px'}}></div>
          </div>
        </React.Fragment>
      );
    }

    return null;
  };

  return (
    <React.Fragment>
      {showRestartConfirm && <RestartModal />}
      <div style={wrapStyle}>
        <div style={inner}>
          {renderPage()}
        </div>
      </div>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BoldTravelerCompassM2L1 />);
</script>
</body>
</html>
