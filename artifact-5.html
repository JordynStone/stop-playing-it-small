<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bold Traveler Compass — From Occasional to Regular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F8F6F0; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #3A3A3A;
    line-height: 1.6;
    min-height: 100vh;
  }
  button:not(:disabled):hover { transform: translateY(-2px); }
  button:not(:disabled):active { transform: translateY(0); }
  textarea:focus, input:focus { border-color: #D4A574 !important; outline: none;
    box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18) !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TEAL = '#2C5F5D';
const GOLD = '#D4A574';
const CREAM = '#F8F6F0';
const CORAL = '#E8A87C';
const CHARCOAL = '#3A3A3A';

const NEXT_LESSON_URL = 'https://www.skool.com/solo-and-fearless-3331/classroom/e6454d3e?md=71c4299931a14598a31d7371c0665a58';

const IconCompass = ({ size = 28, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  </svg>
);

const IconDownload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
);

const IconUpload = ({ size = 20, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
);

const IconArrowRight = ({ size = 18, color = '#fff' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  </svg>
);

const IconArrowLeft = ({ size = 18, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <polyline points="12 19 5 12 12 5"/>
  </svg>
);

const IconSparkle = ({ size = 18, color = GOLD }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
  </svg>
);

const IconRefresh = ({ size = 20, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </svg>
);

const IconCheckCircle = ({ size = 22, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  </svg>
);

const IconMapPin = ({ size = 16, color = TEAL }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
    <circle cx="12" cy="10" r="3"/>
  </svg>
);

const tripCountOptions = [
  { id: 1, label: '1 trip', desc: 'One bold solo trip this year' },
  { id: 2, label: '2 trips', desc: 'Two solo trips, real momentum' },
  { id: 3, label: '3 trips', desc: 'Three trips, solo travel is part of your life' },
  { id: 4, label: '4 or more', desc: 'A travel-led year' },
];

const quarters = [
  { id: 'q1', label: 'Q1', months: 'Jan – Mar' },
  { id: 'q2', label: 'Q2', months: 'Apr – Jun' },
  { id: 'q3', label: 'Q3', months: 'Jul – Sep' },
  { id: 'q4', label: 'Q4', months: 'Oct – Dec' },
];

const PAGES = ['import', 'continuity', 'tripCount', 'tripSchedule', 'save', 'exported'];

function BoldTravelerCompassM3L1() {
  const [pageIndex, setPageIndex] = useState(0);
  const [importedData, setImportedData] = useState(null);
  const [importError, setImportError] = useState(null);
  const [tripCount, setTripCount] = useState(null);
  const [trips, setTrips] = useState([]);
  const [hasExported, setHasExported] = useState(false);
  const [showRestartConfirm, setShowRestartConfirm] = useState(false);
  const fileInputRef = useRef(null);

  const page = PAGES[pageIndex];

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [pageIndex]);

  const goNext = () => setPageIndex(i => Math.min(i + 1, PAGES.length - 1));
  const goBack = () => setPageIndex(i => Math.max(i - 1, 0));

  const handleRestart = () => setShowRestartConfirm(true);
  const cancelRestart = () => setShowRestartConfirm(false);
  const confirmRestart = () => {
    setPageIndex(0);
    setImportedData(null);
    setImportError(null);
    setTripCount(null);
    setTrips([]);
    setHasExported(false);
    setShowRestartConfirm(false);
  };

  useEffect(() => {
    if (tripCount === null) {
      setTrips([]);
      return;
    }
    setTrips(prev => {
      const newTrips = [];
      for (let i = 0; i < tripCount; i++) {
        if (prev[i]) {
          newTrips.push(prev[i]);
        } else {
          newTrips.push({
            quarter: null,
            isMainDestination: i === 0,
          });
        }
      }
      let mainFound = false;
      return newTrips.map(t => {
        if (t.isMainDestination && !mainFound) {
          mainFound = true;
          return t;
        }
        if (t.isMainDestination) {
          return { ...t, isMainDestination: false };
        }
        return t;
      });
    });
  }, [tripCount]);

  const setTripQuarter = (index, quarterId) => {
    setTrips(prev => prev.map((t, i) =>
      i === index ? { ...t, quarter: quarterId } : t
    ));
  };

  const setMainDestinationTrip = (index) => {
    setTrips(prev => prev.map((t, i) => ({
      ...t,
      isMainDestination: i === index,
    })));
  };

  const handleFileImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.name.endsWith('.json')) {
      setImportError('That does not look like a Compass progress file. It should end in .json');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.sections || !data.sections.nextDestination) {
          setImportError('This file is missing your destination from Module 2 Lesson 4. Make sure you are importing the BoldTraveler_Progress4.json file.');
          return;
        }
        setImportedData(data);
        setImportError(null);
        goNext();
      } catch (err) {
        setImportError('Could not read this file. It may be corrupted. Try downloading it again from Module 2 Lesson 4.');
      }
    };
    reader.readAsText(file);
  };

  const destination = importedData?.sections?.nextDestination?.destination || '';

  const canAdvanceFromTripCount = tripCount !== null;
  const allTripsScheduled = trips.length > 0 && trips.every(t => t.quarter !== null);
  const hasMainDestination = trips.some(t => t.isMainDestination);
  const canAdvanceFromSchedule = allTripsScheduled && hasMainDestination;

  const wrapStyle = {
    fontFamily: "'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif",
    background: 'radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%), radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%), radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%), ' + CREAM,
    backgroundAttachment: 'fixed', color: CHARCOAL,
    minHeight: '100vh', padding: '80px 32px 120px', lineHeight: 1.6,
  };

  const inner = { maxWidth: '720px', margin: '0 auto' };

  const card = {
    background: '#fff', borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '36px 32px 60px',
    boxShadow: '0 10px 30px rgba(44,95,93,0.09)',
    marginBottom: '20px',
  };

  const headerBar = {
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    gap: '10px', marginBottom: '24px', paddingBottom: '14px',
    borderBottom: `1px solid ${GOLD}40`,
  };

  const headerLeft = { display: 'flex', alignItems: 'center', gap: '10px' };

  const headerTitle = {
    fontSize: '13px', fontWeight: 600, color: TEAL,
    letterSpacing: '1.2px', textTransform: 'uppercase',
  };

  const refreshBtn = {
    background: '#FFFFFF', border: '1px solid rgba(212,165,116,0.55)', color: TEAL,
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)', transition: 'transform .2s, box-shadow .2s',
    cursor: 'pointer', padding: '8px', borderRadius: '999px',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
  };

  const h1 = { fontSize: '26px', fontWeight: 700, color: TEAL, marginBottom: '8px', lineHeight: 1.25 };
  const h2 = { fontSize: '20px', fontWeight: 600, color: TEAL, marginBottom: '14px', lineHeight: 1.3 };
  const h3 = { fontSize: '16px', fontWeight: 600, color: TEAL, marginBottom: '10px', lineHeight: 1.3 };
  const label = { fontSize: '12px', fontWeight: 600, color: GOLD, letterSpacing: '1.5px', textTransform: 'uppercase', marginBottom: '12px', display: 'block' };
  const p = { fontSize: '15.5px', color: CHARCOAL, marginBottom: '14px', lineHeight: 1.65 };
  const blockquote = { borderLeft: `3px solid ${GOLD}`, paddingLeft: '16px', fontSize: '15.5px', fontStyle: 'italic', color: CHARCOAL, margin: '16px 0', lineHeight: 1.6 };

  const optionButton = (selected) => ({
    width: '100%', textAlign: 'left', padding: '16px 18px', marginBottom: '10px',
    border: `2px solid ${selected ? TEAL : '#E5E0D5'}`,
    background: selected ? `${TEAL}0D` : '#fff',
    borderRadius: '14px', cursor: 'pointer', fontFamily: 'inherit',
    color: CHARCOAL, transition: 'all 0.15s ease, transform .2s, box-shadow .2s',
    display: 'flex', alignItems: 'flex-start', gap: '12px',
    boxShadow: selected ? '0 8px 22px rgba(44,95,93,0.22)' : '0 10px 30px rgba(44,95,93,0.09)',
});

  const radioCircle = (selected) => ({
    width: '20px', height: '20px', borderRadius: '50%',
    border: `2px solid ${selected ? TEAL : '#C4BDB0'}`,
    background: selected ? TEAL : 'transparent', flexShrink: 0,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    marginTop: '2px',
  });

  const radioDot = { width: '8px', height: '8px', borderRadius: '50%', background: '#fff' };

  const primaryButton = (disabled) => ({
    background: disabled ? '#C4BDB0' : 'linear-gradient(to bottom, #37716E, #2C5F5D)', color: '#fff', border: 'none',
    padding: '14px 24px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
    boxShadow: disabled ? 'none' : '0 8px 22px rgba(44,95,93,0.32)',
});

  const backButton = {
    background: '#FFFFFF', color: TEAL,
    border: '1px solid rgba(212,165,116,0.55)',
    padding: '14px 24px', borderRadius: '999px', fontFamily: 'inherit',
    fontSize: '15px', fontWeight: 700, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px',
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)',
};

  const successButton = {
    background: 'linear-gradient(to bottom, #E0B98A, #D4A574)', color: '#142E2C', border: 'none', padding: '14px 24px',
    borderRadius: '999px', fontFamily: 'inherit', fontSize: '15px', fontWeight: 700,
    boxShadow: '0 8px 22px rgba(212,165,116,0.45)',
    cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '10px',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s', letterSpacing: '0.3px', textDecoration: 'none',
  };

  const hr = { border: 'none', borderTop: `1px solid ${GOLD}40`, margin: '24px 0' };

  const navRow = {
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    gap: '12px', marginTop: '8px', marginBottom: '32px', flexWrap: 'wrap',
  };

  const successCard = {
    background: `${GOLD}15`, border: `2px solid ${GOLD}`,
    borderRadius: '12px', padding: '28px 24px', marginBottom: '20px', textAlign: 'center',
  };

  const destinationHighlight = {
    background: `${GOLD}15`, border: `1px solid ${GOLD}`,
    borderRadius: '10px', padding: '20px 22px',
    marginTop: '20px', marginBottom: '12px',
  };

  const errorBox = {
    background: `${CORAL}20`, border: `1px solid ${CORAL}`,
    borderRadius: '8px', padding: '12px 16px',
    fontSize: '14px', color: CHARCOAL, marginBottom: '16px',
  };

  const tripBlock = (isMain) => ({
    background: isMain ? `${GOLD}10` : '#FDFCF7',
    border: `1px solid ${isMain ? GOLD : '#E5E0D5'}`,
    borderRadius: '10px',
    padding: '18px 18px 20px',
    marginBottom: '14px',
  });

  const quarterGrid = {
    display: 'grid',
    gridTemplateColumns: 'repeat(4, 1fr)',
    gap: '8px',
  };

  const quarterBtn = (selected) => ({
    padding: '12px 6px', borderRadius: '999px',
    border: `2px solid ${selected ? TEAL : '#E5E0D5'}`,
    background: selected ? 'linear-gradient(to bottom, #37716E, #2C5F5D)' : '#fff',
    color: selected ? '#fff' : CHARCOAL,
    fontFamily: 'inherit', cursor: 'pointer',
    transition: 'all 0.15s ease, transform .2s, box-shadow .2s',
    textAlign: 'center',
    display: 'flex', flexDirection: 'column', alignItems: 'center',
    gap: '2px',
    boxShadow: selected ? '0 8px 22px rgba(44,95,93,0.32)' : '0 10px 30px rgba(44,95,93,0.09)',
});

  const mainToggleRow = {
    display: 'flex', alignItems: 'center', gap: '8px',
    marginTop: '14px', paddingTop: '14px',
    borderTop: '1px dashed #E5E0D5',
  };

  const mainToggleBtn = (selected) => ({
    background: '#FFFFFF',
    border: '1px solid rgba(212,165,116,0.55)',
    color: selected ? TEAL : '#8B8B8B',
    fontFamily: 'inherit',
    fontSize: '13px',
    fontWeight: 700,
    boxShadow: '0 8px 22px rgba(212,165,116,0.30)', transition: 'transform .2s, box-shadow .2s',
    cursor: selected ? 'default' : 'pointer',
    padding: '9px 18px',
    display: 'inline-flex',
    alignItems: 'center',
    gap: '6px',
    textDecoration: 'none',
  });

  const modalOverlay = {
    position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
    background: 'rgba(58, 58, 58, 0.55)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    zIndex: 1000, padding: '24px',
  };

  const modalCard = {
    background: '#fff', borderRadius: '16px',
    borderTop: '3px solid #D4A574',
    padding: '32px 28px', maxWidth: '440px', width: '100%',
    boxShadow: '0 20px 46px rgba(20, 46, 44, 0.4)',
  };

  const Header = () => (
    <div style={headerBar}>
      <div style={headerLeft}>
        <IconCompass size={22} />
        <div style={headerTitle}>Bold Traveler Compass</div>
      </div>
      <button style={refreshBtn} onClick={handleRestart} title="Start over" aria-label="Start over">
        <IconRefresh size={20} color={TEAL} />
      </button>
    </div>
  );

  const RestartModal = () => (
    <div style={modalOverlay} onClick={cancelRestart}>
      <div style={modalCard} onClick={(e) => e.stopPropagation()}>
        <h2 style={{...h2, marginBottom: '12px'}}>Start over?</h2>
        <p style={p}>
          This will clear everything you have filled in on this page and bring you back to the beginning. Anything you have not downloaded yet will be lost.
        </p>
        <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '24px'}}>
          If you have already downloaded a progress file, you can import it again next time to pick up where you left off.
        </p>
        <div style={{display: 'flex', gap: '12px', justifyContent: 'flex-end', flexWrap: 'wrap'}}>
          <button style={backButton} onClick={cancelRestart}>Keep my answers</button>
          <button style={{...primaryButton(false), background: CORAL}} onClick={confirmRestart}>
            Yes, start over
          </button>
        </div>
      </div>
    </div>
  );

  const handleExport = () => {
    const tripsForExport = trips.map((t, i) => ({
      tripNumber: i + 1,
      quarter: quarters.find(q => q.id === t.quarter)?.label || '',
      quarterMonths: quarters.find(q => q.id === t.quarter)?.months || '',
      destination: t.isMainDestination ? destination : 'To be decided',
      isMainDestination: t.isMainDestination,
    }));

    const updatedData = {
      ...importedData,
      version: (importedData?.version || 1) + 1,
      lastCompleted: 'Module 3 Lesson 1 — From Occasional to Regular',
      timestamp: new Date().toISOString(),
      sections: {
        ...importedData.sections,
        travelYearStructure: {
          tripCount: tripCount,
          trips: tripsForExport,
        },
      },
    };

    const blob = new Blob([JSON.stringify(updatedData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'BoldTraveler_Progress5.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setHasExported(true);
    goNext();
  };

  const renderPage = () => {
    if (page === 'import') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Welcome back</div>
          <h1 style={h1}>Bring your Compass with you.</h1>
          <p style={p}>
            In Module 2 Lesson 4 you named your destination. Now you are going to place it in your year and structure the trips around it.
          </p>
          <p style={{...p, fontSize: '14px', color: '#6B6B6B'}}>
            Look for <strong style={{color: TEAL}}>BoldTraveler_Progress4.json</strong> on your device.
          </p>

          {importError && <div style={errorBox}>{importError}</div>}

          <div style={{marginTop: '20px', marginBottom: '12px'}}>
            <input
              ref={fileInputRef}
              type="file"
              accept=".json,application/json"
              onChange={handleFileImport}
              style={{display: 'none'}}
            />
            <button style={primaryButton(false)} onClick={() => fileInputRef.current?.click()}>
              <IconUpload />
              Choose my progress file
            </button>
          </div>

          <hr style={hr} />

          <div style={{...p, fontSize: '13.5px', color: '#6B6B6B', marginBottom: 0}}>
            <strong style={{color: TEAL}}>Cannot find the file?</strong> No problem. Go back to Module 2 Lesson 4, complete it, and download the file from there. Then come back here.
          </div>
          <div style={{minHeight: '24px'}}></div>
        </div>
      );
    }

    if (page === 'continuity') {
      return (
        <div style={card}>
          <Header />
          <div style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px'}}>
            <IconCheckCircle size={22} color={TEAL} />
            <div style={{...label, marginBottom: 0, color: TEAL}}>Progress restored</div>
          </div>
          <h1 style={h1}>Place your destination in your year.</h1>
          <p style={p}>
            From here, solo travel stops being something you carve out for and becomes something you plan around.
          </p>

          <div style={destinationHighlight}>
            <div style={{...label, color: TEAL, marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '6px'}}>
              <IconMapPin size={14} color={TEAL} />
              Your next destination
            </div>
            <div style={{fontSize: '18px', color: CHARCOAL, fontWeight: 700, lineHeight: 1.3}}>
              {destination}
            </div>
          </div>

          <p style={{...p, marginTop: '20px'}}>
            Now you are going to decide how many solo trips fit in your year and roughly when each one happens. Your destination will go in one of the slots.
          </p>

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(false)} onClick={goNext}>
              Continue
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'tripCount') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 3 · Lesson 1</div>
          <h1 style={h1}>How many solo trips this year?</h1>
          <p style={{...p, marginTop: '8px'}}>
            Decide once, clearly. Not aspirationally. Realistically. The right number is the one you will actually do, not the one that sounds impressive.
          </p>

          <hr style={hr} />

          <h2 style={h2}>The honest answer.</h2>
          <p style={{...p, fontSize: '14.5px', color: '#6B6B6B'}}>
            One real commitment is better than three aspirational ones you abandon by February.
          </p>

          <div style={{marginTop: '16px', marginBottom: '24px'}}>
            {tripCountOptions.map(opt => (
              <button
                key={opt.id}
                style={optionButton(tripCount === opt.id)}
                onClick={() => setTripCount(opt.id)}
              >
                <div style={radioCircle(tripCount === opt.id)}>
                  {tripCount === opt.id && <div style={radioDot}></div>}
                </div>
                <div style={{flex: 1}}>
                  <div style={{fontSize: '15px', fontWeight: 600, color: CHARCOAL, marginBottom: '4px'}}>
                    {opt.label}
                  </div>
                  <div style={{fontSize: '13.5px', color: '#6B6B6B', lineHeight: 1.5}}>
                    {opt.desc}
                  </div>
                </div>
              </button>
            ))}
          </div>

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(!canAdvanceFromTripCount)} onClick={goNext} disabled={!canAdvanceFromTripCount}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {!canAdvanceFromTripCount && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Pick a number to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'tripSchedule') {
      return (
        <div style={card}>
          <Header />
          <div style={label}>Module 3 · Lesson 1</div>
          <h1 style={h1}>When do they happen?</h1>
          <p style={{...p, marginTop: '8px'}}>
            Pick the rough quarter for each trip. Not exact dates. A structure your budget and leave days can organise themselves around.
          </p>
          <p style={{...p, fontSize: '14px', color: '#6B6B6B'}}>
            Then mark which trip is <strong style={{color: TEAL}}>{destination}</strong>. Your other trips can be decided later.
          </p>

          <hr style={hr} />

          <div style={{marginTop: '8px', marginBottom: '24px'}}>
            {trips.map((trip, i) => (
              <div key={i} style={tripBlock(trip.isMainDestination)}>
                <div style={{display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: '12px', flexWrap: 'wrap', gap: '8px'}}>
                  <h3 style={{...h3, marginBottom: 0}}>
                    Trip {i + 1}
                    {trip.isMainDestination && (
                      <span style={{
                        marginLeft: '10px',
                        fontSize: '12px',
                        fontWeight: 700,
                        color: '#fff',
                        background: GOLD,
                        padding: '3px 10px',
                        borderRadius: '12px',
                        letterSpacing: '0.5px',
                        verticalAlign: 'middle',
                      }}>
                        {destination.toUpperCase()}
                      </span>
                    )}
                  </h3>
                </div>

                <div style={quarterGrid}>
                  {quarters.map(q => (
                    <button
                      key={q.id}
                      style={quarterBtn(trip.quarter === q.id)}
                      onClick={() => setTripQuarter(i, q.id)}
                    >
                      <div style={{fontSize: '15px', fontWeight: 700}}>{q.label}</div>
                      <div style={{fontSize: '11px', opacity: 0.85}}>{q.months}</div>
                    </button>
                  ))}
                </div>

                {trips.length > 1 && (
                  <div style={mainToggleRow}>
                    <button
                      style={mainToggleBtn(trip.isMainDestination)}
                      onClick={() => !trip.isMainDestination && setMainDestinationTrip(i)}
                      disabled={trip.isMainDestination}
                    >
                      <IconMapPin size={12} color={trip.isMainDestination ? TEAL : '#8B8B8B'} />
                      {trip.isMainDestination ? `This is ${destination}` : `Make this ${destination}`}
                    </button>
                  </div>
                )}
              </div>
            ))}
          </div>

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
            <button style={primaryButton(!canAdvanceFromSchedule)} onClick={goNext} disabled={!canAdvanceFromSchedule}>
              Next
              <IconArrowRight />
            </button>
          </div>
          <div style={{minHeight: '48px'}}>
            {!allTripsScheduled && (
              <p style={{...p, fontSize: '13px', color: '#8B8B8B', marginTop: '12px', marginBottom: 0, textAlign: 'right'}}>
                Pick a quarter for every trip to continue.
              </p>
            )}
          </div>
        </div>
      );
    }

    if (page === 'save') {
      const mainTrip = trips.find(t => t.isMainDestination);
      const mainQuarter = mainTrip ? quarters.find(q => q.id === mainTrip.quarter) : null;

      return (
        <div style={card}>
          <Header />
          <div style={label}>Save your progress</div>
          <h1 style={h1}>{tripCount === 1 ? 'Your year has a trip in it.' : `Your year has ${tripCount} trips in it.`}</h1>
          <p style={p}>
            {tripCount === 1
              ? <React.Fragment>One real solo trip. <strong style={{color: TEAL}}>{destination}</strong>{mainQuarter ? ` in ${mainQuarter.label}` : ''}. From here it stops being a hope and becomes a plan.</React.Fragment>
              : <React.Fragment><strong style={{color: TEAL}}>{destination}</strong>{mainQuarter ? ` in ${mainQuarter.label}` : ''}, plus {tripCount - 1} more trip{tripCount - 1 > 1 ? 's' : ''} scheduled across the year.</React.Fragment>
            }
          </p>
          <blockquote style={blockquote}>
            When you know your trips are already part of your year, you stop asking yourself if you will travel again and start asking where the next one will be.
          </blockquote>

          <p style={{...p, fontSize: '14px', color: '#6B6B6B', marginBottom: '20px'}}>
            The file will be saved as <strong style={{color: TEAL}}>BoldTraveler_Progress5.json</strong>. This is the file you will import in Lesson 2 to set up the financial system.
          </p>

          <button style={primaryButton(false)} onClick={handleExport}>
            <IconDownload />
            Download my progress
          </button>

          <hr style={hr} />

          <div style={navRow}>
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Back
            </button>
          </div>
          <div style={{minHeight: '48px'}}></div>
        </div>
      );
    }

    if (page === 'exported') {
      return (
        <React.Fragment>
          <div style={successCard}>
            <div style={{display: 'flex', justifyContent: 'center', marginBottom: '12px'}}>
              <IconSparkle size={32} color={GOLD} />
            </div>
            <h2 style={{...h2, color: TEAL, marginBottom: '10px'}}>Five sections down.</h2>
            <p style={{...p, marginBottom: '6px'}}>
              <strong>BoldTraveler_Progress5.json</strong> has been saved to your device.
            </p>
            <p style={{...p, fontSize: '14.5px', marginBottom: 0}}>
              Your Compass now holds the structure of your travel year. Trips, timing, the destination in its slot. The shape of a travel life.
            </p>
          </div>

          <div style={card}>
            <Header />
            <h2 style={h2}>Continue to Lesson 2</h2>
            <p style={p}>
              The next Compass moment is <em>The Financial System for the Solo Traveler</em>. It is where you set a target number for {destination} and build the system that gets you there.
            </p>
            <a href={NEXT_LESSON_URL} target="_blank" rel="noopener noreferrer" style={successButton}>
              Take me to Lesson 2
              <IconArrowRight />
            </a>
            <hr style={hr} />
            <button style={backButton} onClick={goBack}>
              <IconArrowLeft />
              Go back and review my answers
            </button>
            <div style={{minHeight: '32px'}}></div>
          </div>
        </React.Fragment>
      );
    }

    return null;
  };

  return (
    <React.Fragment>
      {showRestartConfirm && <RestartModal />}
      <div style={wrapStyle}>
        <div style={inner}>
          {renderPage()}
        </div>
      </div>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<BoldTravelerCompassM3L1 />);
</script>
</body>
</html>
